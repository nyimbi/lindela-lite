name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run validate
      # Model boundaries: no flood-probability or return-period field may ship
      # without an agreed model basis. Runs inside validate as well.
      - run: npm run check:model-boundaries

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Enforced thresholds fail the build if coverage regresses. Current
      # baseline is ~77.9% line / 63.9% branch / 79.3% function.
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm audit --audit-level=high
      - name: Scan source for known vulnerabilities
        run: npx --yes trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  live-sources:
    # Scheduled rather than on every push: this depends on third parties being
    # reachable and on their rate limits, so a flaky upstream should not block
    # a commit. Non-strict, so it reports rather than fails the build.
    runs-on: ubuntu-latest
    schedule:
      - cron: '17 6 * * *'
    workflow_dispatch:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fixtures describe what the code expects, not what upstream serves.
      # Three connectors reported success while ingesting nothing, and no
      # fixture test caught any of them. This asks the real sources.
      - name: Check public sources against live upstreams
        run: node scripts/check-live-sources.mjs
      - name: Upload live source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-report
          path: |
            scripts/check-live-sources.mjs
          retention-days: 7

  dashboard:
    # Manual and on-demand: needs a running server and a local Chrome, so it
    # cannot gate a push the way the other jobs do. Catches what unit tests
    # structurally cannot: whether the UI actually responds to a click.
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Seed a demo store
        run: |
          LINDELA_LITE_STORE="$RUNNER_TEMP/store.json" npm run demo:seed
      - name: Start the server
        run: |
          LINDELA_LITE_STORE="$RUNNER_TEMP/store.json" npm start &
          npx --yes wait-on http://127.0.0.1:4177/api/v1/health --timeout 60000
      - name: Drive the dashboard in a headless browser
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/cdp" about:blank &
          npx --yes wait-on http://127.0.0.1:9222/json/version --timeout 60000
          node scripts/check-dashboard-browser.mjs

  provenance:
    needs: [test, coverage, audit, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: slsa-framework/slsa-github-generator@v1.10.0
        with:
          base64-subjects: ''
          upload-assets: true
          compile-generator: true
