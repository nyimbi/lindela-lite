name: CI

# VUL-05. This file had never run. Every push for the repository's whole history
# reported failure in 0s with no jobs, because two independent defects each made
# GitHub reject the whole workflow before it started — and a workflow rejected at
# parse time reports the same "failure" for every commit, so nothing about the
# red X said which commit was bad or that the gates had never executed at all.
#
#   1. `live-sources` carried `schedule:` and `workflow_dispatch:` at *job*
#      level. They are top-level keys; at job level they are unexpected keys and
#      invalidate the file. (The `dashboard` job's `if: github.event_name ==
#      'workflow_dispatch'` could never be true for the same reason.)
#   2. `provenance` invoked `slsa-framework/slsa-github-generator@v1.10.0` as a
#      *step*. That repository publishes a reusable *workflow* and actions under
#      `actions/`; it has no root `action.yml`, so the step is unresolvable and
#      the file is invalid — and validity is checked before `if:`, so the job
#      being tag-gated never protected it.
#
# `actionlint` catches (1) and not (2); (2) needs the remote to be resolved.
# Both are fixed below, and `scripts/check-workflows.mjs` runs actionlint in the
# self-contained gate tier so a third defect of the same class fails locally
# rather than in a run nobody reads.
#
# Everything below is pinned to a commit SHA or an exact version. A mutable tag
# (`@v4`) is a promise the upstream can change after review; these jobs hold
# `contents: write` and `id-token: write`, so a moved tag is arbitrary code with
# a signing identity.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Moved up from the `live-sources` job, where it was invalid. Third parties
  # being unreachable should not gate a commit, so this is a separate schedule
  # rather than a per-push job.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The store conformance suite runs one contract against JsonStore and
    # PostgresStore. Without this service it ran against JsonStore alone and
    # still reported "both backends, one contract" - and the divergence it was
    # written to catch (replaceAnalytics taking four collections on Postgres
    # where the caller passes six) was a Postgres bug, so CI never had a chance
    # to see it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: lindela
          POSTGRES_DB: lindela_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINDELA_LITE_TEST_DATABASE_URL: postgres://postgres:lindela@localhost:5432/lindela_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Model boundaries: no flood-probability or return-period field may ship
      # without an agreed model basis. Runs inside validate as well.
      - run: npm run check:model-boundaries
      # R-76. The self-contained gate tier had never run here. `validate` imports
      # four checks and the rest of the registry was reachable only by typing
      # `npm run gates` on a laptop — so eighteen gates, several of them the only
      # check for a defect class this repository has shipped repeatedly, were
      # decorative in CI. A gate that never runs is not a gate; that is the same
      # failure VUL-05 records one level up, where the workflow itself never ran.
      #
      # The tier is self-contained by construction: file reads plus a few gates
      # that bind an ephemeral port on 127.0.0.1. Measured at ~15s on the whole
      # registry, so it is affordable in the job that already runs the suite.
      - run: npm run gates

  coverage:
    runs-on: ubuntu-latest
    # Same service as the test job, because `test:coverage` runs
    # `test/store-conformance.test.js` and that file now fails rather than
    # silently covering one adapter.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: lindela
          POSTGRES_DB: lindela_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LINDELA_LITE_TEST_DATABASE_URL: postgres://postgres:lindela@localhost:5432/lindela_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      # Enforced thresholds fail the build if coverage regresses. The gate runs
      # the whole suite (`scripts/check-coverage.mjs` enumerates test/), not a
      # hand-picked list: the previous form named six files out of 162, so a
      # module nothing exercised still passed. Measured full-suite baseline is
      # ~95.7% line / 81.7% branch / 93.6% function.
      - run: npm run test:coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high
      # `npx --yes trivy` was not a command: Trivy is not published to npm, so
      # `npx` exited 1 on every run. The scan never happened. The official
      # action is the supported path and is pinned to a commit like everything
      # else here.
      - name: Scan source for known vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'

  sbom:
    runs-on: ubuntu-latest
    # Consumed by `provenance`, which attests exactly these bytes. Without an
    # output the generator would receive an empty subject list — the defect this
    # replaces, in a different place.
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      # Exact version, not `latest`. The SBOM is an attestation of what the tree
      # contains, so the tool that produces it is part of the claim.
      - run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom.cdx.json
      - name: Hash the artifacts the provenance will attest
        id: hash
        # `sha256sum` output, base64-encoded — the format the SLSA generator
        # documents for `base64-subjects`.
        run: echo "hashes=$(sha256sum sbom.cdx.json | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json

  live-sources:
    # Scheduled rather than on every push: this depends on third parties being
    # reachable and on their rate limits, so a flaky upstream should not block
    # a commit. Non-strict, so it reports rather than fails the build.
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      # Fixtures describe what the code expects, not what upstream serves.
      # Three connectors reported success while ingesting nothing, and no
      # fixture test caught any of them. This asks the real sources.
      - name: Check public sources against live upstreams
        run: node scripts/check-live-sources.mjs
      - name: Upload live source report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-source-report
          path: |
            scripts/check-live-sources.mjs
          retention-days: 7

  browser:
    # R-76. Seven gates need a running server and a real Chrome, and for the
    # repository's whole history they ran on nobody's machine but the author's:
    # `check-a11y` (842 lines), `check-responsive` (432), `audit-a11y` (214) and
    # the four drills were green by assertion and unrun by construction. A gate
    # that has never run is not a gate, and a job gated on `workflow_dispatch`
    # is a gate that has never run.
    #
    # This ran as `dashboard`, `workflow_dispatch`-only, driving one of the
    # seven. The tier is the unit that matters: `run-gates.mjs --tier
    # needs-browser` runs exactly the gates that need a browser, so a gate added
    # later joins this job by being classified, not by someone remembering to
    # name it here.
    runs-on: ubuntu-latest
    # The seven gates take ~8 minutes warm. A hung browser would otherwise hold
    # a runner for the six-hour default, so the ceiling is explicit and generous
    # rather than absent.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Seed a demo store
        run: |
          LINDELA_LITE_STORE="$RUNNER_TEMP/store.json" npm run demo:seed
      - name: Start the server
        run: |
          LINDELA_LITE_STORE="$RUNNER_TEMP/store.json" npm start &
          npx --yes wait-on@9.5.1 http://127.0.0.1:4177/api/v1/health --timeout 60000
      - name: Start a headless Chrome
        run: |
          google-chrome --headless --disable-gpu --no-sandbox \
            --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/cdp" about:blank &
          # `http-get://`, not `http://`. `wait-on` defaults to a HEAD request for
          # an `http://` target, and Chrome's DevTools endpoint answers HEAD by
          # closing the connection mid-response — axios reports `Parse Error:
          # Expected HTTP/, RTSP/ or ICE/` and the wait times out against a
          # Chrome that is up and listening. This step failed exactly that way on
          # the first run that ever executed it (run 38287359750): the log shows
          # `DevTools listening on ws://127.0.0.1:9222/...` two lines above
          # `Timed out waiting for: http://127.0.0.1:9222/json/version`, and the
          # seven browser gates were skipped behind it. A plain GET on the same
          # URL returns 200 with 427 bytes of JSON. Do not "simplify" this back
          # to `http://`.
          npx --yes wait-on@9.5.1 "http-get://127.0.0.1:9222/json/version" --timeout 60000
      - name: Run every gate that needs a browser
        # `RUNNER_TEMP` redirects `audit-a11y`'s two tracked findings files out
        # of the checkout, so the job measures without dirtying the tree.
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/run-gates.mjs --tier needs-browser
      - name: Upload the accessibility findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-findings
          path: ${{ runner.temp }}/lindela-a11y/
          retention-days: 30

  # The SLSA generator is a *reusable workflow*, so it is invoked at job level
  # with `uses:`. The previous form put it in `steps:`, where it resolved to
  # nothing — that repository has no root `action.yml` — and invalidated the
  # entire file. `base64-subjects: ''` was also an attestation of zero
  # artifacts: it now names the release tarball, which is what a consumer
  # verifies against.
  provenance:
    needs: [test, coverage, audit, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@c747fe7769adf3656dc7d588b161cb614d7abfee # v1.10.0
    with:
      base64-subjects: ${{ needs.sbom.outputs.hashes }}
      upload-assets: true
      compile-generator: true
