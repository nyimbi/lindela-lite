android.useAndroidX=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.code.style=official

# AGP 8.7's `androidJdkImage` transform fails under JDK 27 — the build reaches
# `compileDebugKotlin` and then dies in jlink with an error that names a jar
# rather than a version. Recorded here so the fix travels with the project
# instead of living in somebody's shell history.
#
# Override with -Dorg.gradle.java.home=/path/to/jdk17 when building elsewhere.
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
