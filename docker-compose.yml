services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lindela_lite}
      POSTGRES_USER: ${POSTGRES_USER:-lindela}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lindela_lite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-lindela} -d $${POSTGRES_DB:-lindela_lite}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # JSON mode keeps the store at /app/data/lindela-lite-store.json — inside
    # the container filesystem, which a recreate wipes. The demo deployment
    # runs json (Task 5), so the store is bind-mounted to ./data on the host:
    # it survives every recreate, and the post-seed backup is one scp. The
    # deploy transport excludes data/ by design, so nothing on the host is
    # overwritten by a code deploy. Postgres mode stores nothing here.
    volumes:
      - ./data:/app/data
    environment:
      # Parameterized 2026-10-09 (demo-polish Task 5): the demo deployment runs
      # json so /health reports the required storage shape; the default here
      # stays postgres for a real deployment. `demo:seed` works in both modes.
      LINDELA_LITE_DB_MODE: ${LINDELA_LITE_DB_MODE:-postgres}
      LINDELA_LITE_DATABASE_URL: ${LINDELA_LITE_DATABASE_URL}
      LINDELA_LITE_API_KEY: ${LINDELA_LITE_API_KEY}
      LINDELA_LITE_PORT: ${LINDELA_LITE_PORT:-4177}
      # Explicit, though it matches the default: binding loopback inside a
      # container would make the published port unreachable, so the container
      # must bind every interface and it is better said than implied.
      LINDELA_LITE_HOST: 0.0.0.0
      # Per-deployment public-read widening (prefix-matched; see auth.js and
      # docs/configuration.md). Everything not listed stays token-gated — the
      # alert approval subtree and every write path in particular.
      LINDELA_LITE_PUBLIC_PATHS: ${LINDELA_LITE_PUBLIC_PATHS:-}
      NASA_FIRMS_MAP_KEY: ${NASA_FIRMS_MAP_KEY:-OPEN_KEY}
      RAPIDPRO_BASE_URL: ${RAPIDPRO_BASE_URL:-https://rapidpro.io}
      RAPIDPRO_API_TOKEN: ${RAPIDPRO_API_TOKEN:-}
      RAPIDPRO_ALERT_MODE: ${RAPIDPRO_ALERT_MODE:-flow_start}
      RAPIDPRO_ALERT_FLOW_UUID: ${RAPIDPRO_ALERT_FLOW_UUID:-}
      RAPIDPRO_ALERT_URNS: ${RAPIDPRO_ALERT_URNS:-}
      RAPIDPRO_ALERT_CONTACTS: ${RAPIDPRO_ALERT_CONTACTS:-}
      RAPIDPRO_ALERT_GROUPS: ${RAPIDPRO_ALERT_GROUPS:-}
      RAPIDPRO_BASE_LANGUAGE: ${RAPIDPRO_BASE_LANGUAGE:-eng}
      RAPIDPRO_WEBHOOK_SECRET: ${RAPIDPRO_WEBHOOK_SECRET:-}
    ports:
      - "${LINDELA_LITE_PORT:-4177}:4177"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4177/api/v1/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  lindela_lite_pgdata:
