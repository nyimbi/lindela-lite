      responses:
        '200':
          description: The rejected alert event
  /api/v1/alert-events/{id}.cap:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      # Documented as `application/json` / FeatureCollection until 2026-10-03.
      # `src/server.js:1960` serves `application/xml` — CAP 1.2 — and a client
      # generated from the old description parses it as a broken payload.
      # `check-openapi.mjs` compares paths, not media types, so it passed: a
      # wrong path is a client that cannot call the endpoint, a wrong content
      # type is a client that calls it and then fails to read the answer.
      summary: CAP 1.2 alert message for an alert event
      responses:
        '200':
          description: A CAP 1.2 `alert` message
          content:
            application/xml:
              schema:
                type: string
                description: |
                  An OASIS Common Alerting Protocol 1.2 document. The message
                  type follows the alert's lifecycle: `Alert` while open,
                  `Update` once acknowledged, `Cancel` once resolved. A resolved
                  alert still emits a Cancel rather than nothing — CAP retires
                  a prior Alert by identifier, so suppressing the message would
                  leave every downstream subscriber holding the live alert.
                  `scope` defaults to `Public` for every alert; a
                  `<restriction>` element states the dissemination basis of this
                  particular message.
  /api/v1/disease-observations/summary:
    get:
      summary: Outbreak context roll-up
      responses:
        '200':
          description: Summary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Required on every route. Routes named in LINDELA_LITE_PUBLIC_PATHS are
        reachable without a token; the default public set is /api/v1/health and
        /api/v1/ready, neither of which returns records.
  parameters:
    Country:
      name: country
      in: query
      schema:
        type: string
    Bbox:
      name: bbox
      in: query
      description: west,south,east,north
      schema:
        type: string
    EventType:
      name: event_type
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    Priority:
      name: priority
      in: query
      schema:
        type: string
        enum: [low, medium, high, critical]
    IncidentId:
      name: incident_id
      in: query
      schema:
        type: string
    InterventionId:
      name: intervention_id
      in: query
      schema:
        type: string
  schemas:
    SchoolAttendanceInput:
      type: object
      required: [school_id, present, enrolled]
      properties:
        school_id: { type: string }
        school_name: { type: string }
        district: { type: string }
        present: { type: integer, minimum: 0 }
        enrolled:
          type: integer
          minimum: 1
          description: >-
            Required and at least 1. An attendance rate divides by this, and a
            zero denominator is a division by zero that would otherwise be
            reported as a rate of 0 — "nobody attended" rather than "nobody
            was enrolled".
        observed_at: { type: string, format: date-time }
        source: { type: string }
    IotObservationInput:
      type: object
      required: [sensor_id, sensor_type, value]
      properties:
        sensor_id: { type: string }
        sensor_type:
          type: string
          enum: [cold_chain, flood_gauge, heat, humidity, water_point]
        value: { type: number }
        unit: { type: string }
        lat: { type: number }
        lon: { type: number }
        district: { type: string }
        observed_at: { type: string, format: date-time }
        battery_pct: { type: number, minimum: 0, maximum: 100 }
    ProtocolExecution:
      type: object
      description: >-
        One protocol evaluation that produced something. status is not a
        success/failure pair: "partial" means the playbook partly ran and
        "refused" means no step ran at all, which the feed renders differently.
      required: [id, protocol_id, mode, status, fired_at]
      properties:
        id: { type: string }
        protocol_id: { type: string }
        protocol_name: { type: string }
        protocol_version: { type: integer }
        mode:
          type: string
          enum: [live, shadow]
          description: >-
            shadow records what would have fired and does nothing else; it is
            how a protocol is tuned before it is trusted with an action.
        status:
          type: string
          enum: [executed, partial, refused, shadow]
        metric: { type: string }
        operator: { type: string }
        threshold: { type: number }
        observed_value: { type: number }
        would_fire:
          type: boolean
          description: Present on shadow rows; what a live row would have recorded.
        alert_id:
          type: string
          nullable: true
          description: Null on a shadow row, which raises no alert.
        dry_run:
          type: boolean
          description: Set on a dry run, which returns the plan and writes nothing.
        actions:
          type: array
          description: >-
            One entry per playbook step, each executed or refused. A refused
            step carries a detail saying why, and what a person can still do.
          items:
            type: object
            properties:
              type: { type: string }
              status:
                type: string
                enum: [executed, refused]
              record_id: { type: string }
              detail: { type: string }
        actor: { type: string }
        fired_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    PaginationMeta:
      type: object
      description: >-
        Present on collection routes. total counts everything that matched the
        filters; data carries one page. Without total a caller cannot tell an
        empty collection from a truncated one.
      required: [returned, limit, total, has_more, next_cursor]
      properties:
        returned:
          type: integer
          description: Records in this response
        limit:
          type: integer
          maximum: 5000
        total:
          type: integer
          description: Records that matched the filters, across all pages
        has_more:
          type: boolean
        next_cursor:
          type: string
          nullable: true
          description: Pass back as ?cursor= to read the next page
            interval_seconds:
              type: integer
              nullable: true
            last_failure:
              type: string
              nullable: true
            note:
              type: string
              nullable: true
    ReadinessResponse:
      type: object
      required: [success, ready, store, idempotency, metrics, uptime, pii, checked_at]
      properties:
        success:
          type: boolean
        ready:
          type: boolean
        store:
          type: object
          properties:
            mode:
              type: string
            reachable:
              type: boolean
            latency_ms:
              type: integer
            error:
              type: string
              nullable: true
        idempotency:
          type: object
          description: >-
            The bound on the idempotency guarantee, reported rather than
            implied. In-process, 24 hours, 1000 entries.
          properties:
            in_process:
              type: boolean
            ttl_hours:
              type: integer
        audit:
          type: object
          nullable: true
          description: >-
            Roll-up of the action-log hash chain. `valid: false` means the chain
            does not recompute, and degrades readiness. `valid: null` means the
            roll-up itself could not be computed. Read `linked` alongside it:
            `linked: true` means the stored rows carry their own `seq` and
            `entry_hash`, so `valid` is a statement about the stored chain;
            `linked: false` means the rows carry no linkage and `valid` is only
            content-consistency, which cannot detect an edit made before the
            probe. `anchored: true` additionally means a published head was
            supplied out of band.
          properties:
            valid:
              type: boolean
              nullable: true
            linked:
              type: boolean
              description: >-
                Whether the stored rows carried `seq` and `entry_hash`. When
                false, `valid` is not tamper-evidence.
            anchored:
              type: boolean
        outbox:
          type: object
          nullable: true
          description: >-
            Roll-up of the outbox. `degraded: true` means at least one delivery
            is dead-lettered, and degrades readiness.
        metrics:
          type: object
          description: >-
            What the metric cardinality bounds refused. Counts, never a silent
            discard: a series cap that discards without reporting is
            indistinguishable from a metric that is simply not being written.
          properties:
            droppedKeys:
              type: integer
              description: Label keys not in the metric's allowlist.
            bucketedValues:
              type: integer
              description: Label values folded into `/unmatched` past their budget.
            evictedSeries:
              type: integer
              description: Series evicted to stay under the per-family cap.
            max_series:
              type: integer
            series:
              type: integer
        uptime:
          type: object
          description: How long this instance has been up, from process start.
          properties:
            started_at:
              type: string
            uptime_seconds:
              type: integer
        pii:
          type: object
          description: >-
            Whether the pseudonym salt is deployment-scoped or generated. A
            generated salt means every pseudonym written so far becomes
            unlinkable at the next restart. Never echoes the salt.
          properties:
            source:
              type: string
              enum: [configured, generated]
            saltId:
              type: string
              description: Short public fingerprint, not the salt.
            digestBits:
              type: integer
        checked_at:
          type: string
    AuthInfoResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            subject:
              type: string
              nullable: true
              description: Non-reversible fingerprint of the presented token
            scopes:
              type: array
              items:
                type: string
            partner_org:
              type: string
              nullable: true
            auth_configured:
              type: boolean
    GeoJsonFeatureCollection:
      type: object
      description: RFC 7946 FeatureCollection.
      required: [type, features]
      properties:
        type:
          type: string
          enum: [FeatureCollection]
        features:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [Feature]
              geometry:
                type: object
                nullable: true
                description: >-
                  Null where the record has no usable geometry. The map used to
                  drop records whose coordinates were exactly 0, which is the
                  equator and the prime meridian.
              properties:
                type: object
    HealthResponse:
      type: object
      required: [success, status, version, counts, sources, exclusions, storage, auth, pipeline]
      properties:
        success:
          type: boolean
        status:
          type: string
          description: >-
            ok, starting, or degraded. `starting` means no periodic cycle has
            completed yet — a process four seconds old, not a broken one.
            `degraded` means one completed and has since gone stale, which is
            the case that matters: a pipeline that ran and stopped.
          enum: [ok, starting, degraded]
        version:
          type: string
          description: >-
            Released build version, read from package.json at startup. The
            dashboards display this rather than carrying their own literal,
            because a hardcoded version drifted behind the release and would
            report a build that was not the one running.
          example: 0.2.0
        updated_at:
          type: string
        counts:
          type: object
        sources:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string
        storage:
          type: object
          properties:
            mode:
              type: string
              enum: [json, pg0, postgres, custom]
        auth:
          type: object
          description: >-
            The authentication posture of this deployment, on the one route an
            operator can reach without holding a token. It used to live only on
            /api/v1/auth-info, which requires a token, so the person asking
            whether a deployment was secured was the one person who could not
            find out. A boolean, the public-path list, and nothing about which
            token holds what.
          required: [configured, enforced, public_paths]
          properties:
            configured:
              type: boolean
              description: >-
                Whether any credential is configured at all. `false` here means
                the deployment is running unauthenticated, which is a deliberate
                mode and not a failure - but it is also indistinguishable from a
                typo in LINDELA_LITE_TOKENS, which is why this field exists.
            enforced:
              type: boolean
              description: >-
                Whether the request gate is running. It tracks `configured`;
                false does not mean unsecured, it means there is nothing to
                enforce.
            public_paths:
              type: array
              description: >-
                Paths reachable without a token, whatever the token
                configuration. An operator sets LINDELA_LITE_PUBLIC_PATHS to
                widen this deliberately; there is no blanket public-reads
                switch.
              items:
                type: string
              example: ['/api/v1/health', '/api/v1/ready']
        pipeline:
          type: object
          description: >-
            Whether the work this process exists to do is happening. The health
            payload previously asserted exactly one thing — that the store
            answered — and returned a literal `ok`, so a process that was up,
            serving 200s, and whose pipeline had been dead for a week was
            indistinguishable from a healthy one. `Dockerfile` polls this
            endpoint every 30 seconds.
          properties:
            healthy:
              type: boolean
            last_success_age_seconds:
              type: integer
              nullable: true
    ListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
    Region:
      type: object
      required: [name, country, lat, lon]
      properties:
        name:
          type: string
        country:
          type: string
        lat:
          type: number
        lon:
          type: number
    IngestionScheduleInput:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [open_meteo, gdacs, glofas, chirps, nasa_firms, service_assets, acled_csv, conflict_csv]
        status:
          type: string
          enum: [active, paused, archived]
        interval_minutes:
          type: integer
          minimum: 1
        timeout_ms:
          type: integer
          minimum: 1000
        retries:
          type: integer
          minimum: 0
        stale_after_minutes:
          type: integer
          minimum: 1
        next_run_at:
          type: string
        default_options:
          type: object
    UploadReport:
      type: object
      properties:
        success:
          type: boolean
        dry_run:
          type: boolean
        collection:
          type: string
        filename:
          type: string
          nullable: true
        imported:
          type: integer
        total_rows:
          type: integer
          description: Data rows read, excluding the header and wholly blank lines
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        error_count:
          type: integer
          description: Total errors. `errors` below is capped at 20.
        errors_truncated:
          type: boolean
        headers:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                description: Line number in the file, counting the header as line 1
              column:
                type: string
                nullable: true
              value:
                description: The value that was found, verbatim
                nullable: true
              message:
                type: string
    ServiceAssetInput:
      type: object
      required: [name, service_type, country, latitude, longitude]
      properties:
        name:
          type: string
        service_type:
          type: string
          enum: [health, water, road, school, power, telecom, market, other]
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    IncidentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        incident_type:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    RapidProDispatchInput:
      type: object
      properties:
        mode:
          type: string
          enum: [flow_start, broadcast]
        urns:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        text:
          type: string
    ReportTemplateInput:
      type: object
      required: [name, report_type]
      properties:
        name:
          type: string
        report_type:
          type: string
          enum: [situation_report, incident_brief, intervention_update, data_quality_report, alert_digest]
        title_pattern:
          type: string
        default_filters:
          type: object
        sections:
          type: array
          items:
            type: string
        distribution_defaults:
          type: array
          items:
            type: object
    ReportInput:
      type: object
      properties:
        template_id:
          type: string
        report_type:
          type: string
          enum: [situation_report, incident_brief, intervention_update, data_quality_report, alert_digest]
        scope:
          type: object
        generate:
          type: boolean
        section_ids:
          type: array
          items:
            type: string
    ReportDistributionInput:
      type: object
      properties:
        channels:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                enum: [markdown_download, json, csv, geojson, webhook, rapidpro_sms]
              url:
                type: string
              urns:
                type: array
                items:
                  type: string
              contacts:
                type: array
                items:
                  type: string
              groups:
                type: array
                items:
                  type: string
    ReportScheduleInput:
      type: object
      required: [template_id]
      properties:
        template_id:
          type: string
        timezone:
          type: string
        recurrence:
          type: object
        next_run_at:
          type: string
        auto_distribute:
          type: boolean
    FloodDepthGrid:
      type: object
      description: |
        Depth grid for one water surface elevation. `model` states the
        limitation in the payload itself so a caller can judge answerability
        without reading the docs.
      required: [bounds, size, level_m, depth_grid, model, vertical_resolution_m]
      properties:
        bounds:
          type: object
          properties:
            south: { type: number }
            west: { type: number }
            north: { type: number }
            east: { type: number }
        size:
          type: integer
          description: Cells per axis; depth_grid is row-major and north-first.
        zoom:
          type: integer
          description: Terrain tile zoom used, lowered automatically when the tile budget is exceeded.
        level_m:
          type: number
        levels_m:
          type: array
          items: { type: number }
        coverage_pct:
          type: number
          description: Share of cells with terrain data, not share flooded.
        elevation_range_m:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
        per_level:
          type: array
          description: Flooded cells, coverage, and area per requested level.
          items:
            type: object
            properties:
              level_m: { type: number }
              flooded_cells: { type: integer }
              coverage_pct: { type: number }
              area_sq_km: { type: number }
        depth_grid:
          type: array
          description: Cell depth in metres; null where terrain data is void.
          items:
            type: number
            nullable: true
        extent_geojson:
          type: object
          description: Coarse inundated-extent polygons, one per contiguous run per row.
        vertical_resolution_m:
          type: number
        source:
          type: string
        model:
          type: string
          description: Always states that flow routing and storage are not modelled.
        generated_at:
          type: string
    RiskScore:
      type: object
      description: |
        Decision-support signal. The band fields are a **sensitivity range
        driven by input coverage, not a calibrated predictive distribution**.
        `calibrated_uncertainty` is false and `limits` says so in the payload.
        A zero-width band means inputs were sufficient, not that the outcome is
        certain.
      required: [type, region_name, score, calibrated_uncertainty, limits]
      properties:
        type:
          type: string
          enum: [flood_risk, climate_conflict_risk]
        region_name: { type: string }
        country: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        score: { type: number, minimum: 0, maximum: 100 }
        sensitivity_low: { type: number }
        sensitivity_mid: { type: number }
        sensitivity_high: { type: number }
        sensitivity_width:
          type: number
          description: Zero means input coverage was sufficient, not that uncertainty is absent.
        calibrated_uncertainty:
          type: boolean
          enum: [false]
          description: No calibrated bands ship with this release; no Brier or CRPS calibration report exists.
        score_p10:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_low. Retained so existing consumers keep working.
        score_p50:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_mid.
        score_p90:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_high.
        interval_width:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_width.
        risk_level:
          type: string
        confidence:
          type: number
          description: Input-coverage score, not a calibrated probability.
        drivers: { type: object }
        methodology: { type: string }
        limits: { type: string }
        generated_at: { type: string }
    RoadAccess:
      type: object
      required: [road_id, access_status]
      properties:
        id: { type: string }
        road_id: { type: string }
        road_name: { type: string }
        road_class:
          type: string
          enum: [trunk, primary, secondary, tertiary, unpaved, track]
        country: { type: string }
        admin1: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        access_status:
          type: string
          enum: [passable, restricted, impassable]
        access_reason:
          type: string
          description: Plain-language cause, so "clear" is distinguishable from "not assessed".
        access_score:
          type: number
          description: 0-100, weighted by road class criticality.
        access_level:
          type: string
          enum: [open, constrained, severely_constrained, cut_off]
        reported_passability:
          type: string
          nullable: true
          description: Field-reported status, kept separate from hazard-derived status.
        width_m:
          type: number
          nullable: true
        obstruction_count: { type: integer }
        primary_hazard_type:
          type: string
          nullable: true
        confidence: { type: number }
        generated_at: { type: string }
    RoadAccessSummary:
      type: object
      required: [total_roads, cut_off_rate_pct]
      properties:
        generated_at: { type: string }
        total_roads: { type: integer }
        passable: { type: integer }
        restricted: { type: integer }
        impassable: { type: integer }
        cut_off_rate_pct: { type: number }
        blocked_by_hazard_type:
          type: object
          additionalProperties: { type: integer }
        cut_off_roads:
          type: array
          items:
            type: object
            properties:
              road_id: { type: string }
              road_name: { type: string }
              road_class: { type: string }
              reason: { type: string }
              primary_hazard_type: { type: string, nullable: true }
    FoodSecurityRecord:
      type: object
      required: [country, scope, analysis_date, validity_period, phases]
      properties:
        id: { type: string }
        source: { type: string, enum: [ipc_hdx] }
        country: { type: string, description: ISO3 code as IPC publishes it }
        scope: { type: string, enum: [national, area] }
        area: { type: string, nullable: true }
        level1: { type: string, nullable: true }
        analysis_date: { type: string }
        validity_period: { type: string, enum: [current, first_projection, second_projection] }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        total_country_population: { type: integer, nullable: true }
        phase3plus_number: { type: integer, nullable: true }
        phase3plus_fraction:
          type: number
          description: Fraction of the analysed population, e.g. 0.35 for 35% — not 0.35%.
        phases:
          type: object
          description: Published figure per phase label (1-5, 3+, all).
          additionalProperties:
            type: object
            properties:
              number: { type: integer, nullable: true }
              fraction: { type: number, nullable: true }
        bbox:
          type: object
          nullable: true
          description: Bounding box of the mapped area polygon; null where GeoJSON did not match.
          properties:
            south: { type: number }
            west: { type: number }
            north: { type: number }
            east: { type: number }
        latitude: { type: null, nullable: true }
        longitude: { type: null, nullable: true }
        metadata:
          type: object
          description: Classification note, fraction note, validity note, CC0 licence, attribution.
    FoodSecuritySummary:
      type: object
      required: [countries]
      properties:
        generated_at: { type: string }
        methodology: { type: string }
        countries:
          type: array
          items:
            $ref: '#/components/schemas/FoodSecurityRollup'
        worst_areas:
          type: array
          description: Up to ten areas with the highest current-window Phase 3+ fraction.
          items:
            $ref: '#/components/schemas/FoodSecurityRollup'
    FoodSecurityRollup:
      type: object
      required: [country]
      properties:
        country: { type: string }
        area: { type: string, nullable: true }
        analysis_date: { type: string }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date }
        phase3plus_number: { type: integer, nullable: true }
        phase3plus_fraction: { type: number, nullable: true }
    DiseaseObservation:
      type: object
      required: [indicator_code, country, year, value, unit]
      properties:
        id: { type: string }
        source: { type: string, enum: [who_gho] }
        indicator_code: { type: string, example: CHOLERA_0000000001 }
        indicator_name: { type: string }
        unit: { type: string, enum: [cases, deaths, ratio, districts] }
        country: { type: string }
        region: { type: string, nullable: true }
        year: { type: integer }
        value: { type: number }
        first_seen_source_type: { type: string, enum: [national_annual_aggregate] }
        latitude: { type: null, nullable: true }
        longitude: { type: null, nullable: true }
        metadata:
          type: object
          description: Granularity and policy notes; attribution required per WHO data terms.
    DiseaseObservationsSummary:
      type: object
      required: [series_state]
      properties:
        generated_at: { type: string }
        granularity: { type: string }
        attribution: { type: string }
        series_state:
          type: array
          description: Staleness verdict per indicator series — a data fact, not a disease fact.
          items:
            type: object
            properties:
              indicator_code: { type: string }
              indicator_name: { type: string }
              latest_year: { type: integer }
              years_behind_calendar: { type: integer }
              state: { type: string, enum: [current, aging, stale] }
              note: { type: string, nullable: true }
        latest_by_indicator_country:
          type: array
          items:
            type: object
            properties:
              country: { type: string }
              indicator_code: { type: string }
              indicator_name: { type: string }
              year: { type: integer }
              value: { type: number }
              unit: { type: string }
    FittedModelCard:
      type: object
      description: The fitted model — coefficients are per standardized feature unit
      required: [type, features, coefficients, training]
      properties:
        type: { type: string, enum: [logistic_l2_empirical] }
        features: { type: array, items: { type: string } }
        coefficients:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              value: { type: number }
        intercept: { type: number }
        standardization:
          type: array
          items:
            type: object
            properties:
              feature: { type: string }
              mean: { type: number }
              sd: { type: number }
        lambda: { type: number }
        training:
          type: object
          properties:
            months: { type: integer }
            flood_months: { type: integer }
            base_rate: { type: number }
    FloodProbabilityModel:
      type: object
      required: [region_name, trained_at, basis, months_kept, events_matched]
      properties:
        id: { type: string }
        region_name: { type: string }
        country: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        trained_at: { type: string, format: date-time }
        model:
          allOf:
            - $ref: '#/components/schemas/FittedModelCard'
          nullable: true
          description: Fitted card, null only for a refusal record
        folds:
          type: object
          nullable: true
          description: Leave-one-year-out validation scores
          properties:
            brier_score: { type: number }
            brier_of_base_rate: { type: number }
            skill_over_base_rate: { type: number }
            validated_months: { type: integer }
            n_folds: { type: integer }
        contingency:
          type: array
          description: Per-feature contingency counts with Wilson intervals
          items:
            type: object
            properties:
              feature: { type: string }
              percentile: { type: number }
              threshold_mm: { type: number }
              months_above_threshold: { type: integer }
              flood_months_above_threshold: { type: integer }
              conditional_probability: { type: number }
              conditional_probability_wilson:
                type: object
                properties:
                  low: { type: number }
                  high: { type: number }
              lift_over_base_rate: { type: number, nullable: true }
        basis:
          type: object
          description: The frozen MODEL_BASIS object — sources, label definition, rejection reasons, reporting condition
        months_kept: { type: integer }
        events_matched: { type: integer }
        rainfall:
          type: object
          description: Provenance of the rainfall series trained on
          properties:
            record_id: { type: string }
            series_start: { type: string }
            series_end: { type: string }
            series_days: { type: integer }
            days_missing_precipitation: { type: integer }
            provider: { type: string }
    FloodProbabilityScore:
      type: object
      required: [region_name, probability, model]
      properties:
        region_name: { type: string }
        probability: { type: number, description: Reporting-conditioned P(flood enters the GDACS archive in the calendar month) }
        features:
          type: object
          properties:
            max_7_day: { type: number }
            sum_30_day: { type: number }
            sum_90_day: { type: number }
        trained_at: { type: string, format: date-time }
        model:
          $ref: '#/components/schemas/FittedModelCard'
    RoutingPlanInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Road asset id of the distribution origin.
        to:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: One or more destination road asset ids.
        link_radius_km:
          type: number
          description: Max distance at which two road segments are treated as connected.
          default: 5
        max_minutes:
          type: number
          description: Drop legs exceeding this budget rather than reporting them as reachable.
    RoutingPlan:
      type: object
      required: [from, network, legs, summary, fully_deliverable]
      properties:
        from: { type: object }
        network:
          type: object
          properties:
            roads: { type: integer }
            links: { type: integer }
            link_radius_km: { type: number }
            cut_off_roads:
              type: integer
              description: Impassable nodes, whose links are removed from the graph entirely.
        legs:
          type: array
          items:
            type: object
            properties:
              to: { type: object }
              feasible: { type: boolean }
              reason:
                type: string
                nullable: true
                description: Present when infeasible; names the severed segment rather than failing silently.
              mode:
                type: string
                enum: [vehicle, foot]
              total_minutes: { type: number }
              total_distance_km: { type: number }
              hops:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    road_class: { type: string }
                    access_status: { type: string }
              road_classes:
                type: array
                items: { type: string }
              restricted_hops: { type: integer }
              degraded:
                type: boolean
                description: True when the route relies on a restricted segment.
              blocked_by: { type: string, nullable: true }
              severed_by:
                type: array
                description: Cut-off segments plausibly responsible for the severance.
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    blocked_by: { type: string, nullable: true }
              reachable_from_origin:
                type: array
                description: Other roads reachable from the origin but not connecting onward.
                items: { type: string }
              suggestion: { type: string, nullable: true }
        summary:
          type: object
          properties:
            destinations: { type: integer }
            reachable: { type: integer }
            unreachable: { type: integer }
            coverage_pct: { type: number }
            total_minutes: { type: number }
            total_distance_km: { type: number }
            any_degraded: { type: boolean }
            requires_foot: { type: integer }
            blocked_by:
              type: object
              additionalProperties: { type: integer }
        fully_deliverable:
          type: boolean
          description: False when any destination is unreachable. A plan that cannot reach every site is not a plan.
        caveat:
          type: string
          nullable: true
