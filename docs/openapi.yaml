  /api/v1/service-assets:
    get:
      summary: List service assets
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Bbox'
      responses:
        '200':
          description: Service assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
    post:
      summary: Import service assets from JSON, CSV, or GeoJSON
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service_assets:
                  type: array
                  items:
                    $ref: '#/components/schemas/ServiceAssetInput'
                service_assets_csv:
                  type: string
                service_assets_geojson:
                  type: object
      responses:
        '201':
          description: Import accepted
        '400':
          description: Validation error
  /api/v1/service-assets/{id}:
    get:
      summary: Get a service asset
      description: >
        The collection served fine while no single asset was addressable, so a
        caller holding an id — the subject panel, and the routing endpoint's own
        error message telling you to pass asset ids — had no way to resolve one.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Service asset
        '404':
          description: No such asset
  /api/v1/upload:
    get:
      summary: The bulk upload contract
      description: >
        Every collection that can be uploaded into, with the columns it requires
        and the columns it accepts. A client that has to guess will guess wrong,
        and a wrong guess is a validation report to read instead of a column list
        that could have been fetched.
      responses:
        '200':
          description: Upload contract
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          enum: [service_assets, conflict_events, hazard_events, climate_observations]
                        label:
                          type: string
                        required_columns:
                          type: array
                          items:
                            type: string
                        optional_columns:
                          type: array
                          items:
                            type: string
                  accepts:
                    type: array
                    items:
                      type: string
    post:
      summary: Bulk CSV upload with a row-level validation report
      description: >
        Accepts multipart/form-data with a part named `file`, a raw text/csv
        body, or `{csv, collection}` as JSON; all three reach the same validator
        and produce the same report. Set `dry_run=true` to validate and write
        nothing. If any row is rejected the response is 422 and nothing is
        written at all — a partial import is refused, because the caller cannot
        tell which half landed and the half that landed is the half they did not
        look at. Errors are capped at 20 in the body; `error_count` is the true
        total.
      parameters:
        - name: collection
          in: query
          schema:
            type: string
            enum: [service_assets, conflict_events, hazard_events, climate_observations]
            default: service_assets
        - name: dry_run
          in: query
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                collection:
                  type: string
                dry_run:
                  type: boolean
          text/csv:
            schema:
              type: string
          application/json:
            schema:
              type: object
              properties:
                collection:
                  type: string
                csv:
                  type: string
                dry_run:
                  type: boolean
      responses:
        '201':
          description: Imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReport'
        '200':
          description: Dry run — validated, nothing written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReport'
        '400':
          description: Unreadable multipart body or no file part
        '422':
          description: One or more rows failed validation; nothing was written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReport'
  /api/v1/events:
    get:
      summary: Hazard and conflict events
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Bbox'
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/climate:
    get:
      summary: Climate observations
      responses:
        '200':
          description: Climate observations
  /api/v1/weather:
    get:
      summary: Current conditions and 7-day forecast per pilot district
      description: |
        The map weather overlay's roll-up. Per pilot district: one current
        reading and up to seven daily forecast points (precipitation,
        precipitation probability, temperature max, WMO weather code), each
        batch-stamped with the forecast's issue time (`as_of`) and a `stale`
        flag against `stale_after_minutes`.

        Deterministic point forecasts only: no ensemble members, no
        percentiles. A district with no ingested data is present with nulls,
        not omitted — an absent district and an unmeasured one are different
        statements.
      responses:
        '200':
          description: Per-district current conditions and 7-day forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  generated_at: { type: string, format: date-time }
                  source: { type: string }
                  stale_after_minutes: { type: integer }
                  districts_covered: { type: integer }
                  note: { type: ['string', 'null'] }
                  districts:
                    type: array
                    items:
                      type: object
                      properties:
                        slug: { type: string }
                        name: { type: string }
                        country: { type: string }
                        latitude: { type: number }
                        longitude: { type: number }
                        as_of: { type: ['string', 'null'], format: date-time }
                        stale: { type: ['boolean', 'null'] }
                        current:
                          type: ['object', 'null']
                          properties:
                            observed_at: { type: string }
                            temperature_c: { type: ['number', 'null'] }
                            precipitation_mm: { type: ['number', 'null'] }
                            weather_code: { type: ['integer', 'null'] }
                        forecast:
                          type: array
                          items:
                            type: object
                            properties:
                              date: { type: string }
                              precipitation_mm: { type: ['number', 'null'] }
                              precipitation_probability_pct: { type: ['number', 'null'] }
                              temperature_max_c: { type: ['number', 'null'] }
                              weather_code: { type: ['integer', 'null'] }
  /api/v1/flood-risk:
    get:
      summary: Flood risk scores
      description: |
        Decision-support signals, not automated determinations. The band fields
        are a sensitivity range driven by input coverage, not a calibrated
        predictive distribution, and `limits` states this in every response.

        Rainfall intensity/duration to flood probability is not modelled: that
        requires an agreed hydrological model basis and a validated record, and
        invented coefficients would be worse than no output.
      responses:
        '200':
          description: Flood risk scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RiskScore'
  /api/v1/flood-depth:
    get:
      summary: Static flood depth for a water surface elevation
      description: |
        Ground depth below an operator-supplied water surface elevation, using
        keyless AWS Terrarium (SRTM) terrain.

        This is **not** a hydraulic simulation and **not** a forecast: the water
        level is an input, not a prediction. No flow routing, channel geometry,
        or storage is modelled, so a surface at L shades ground below L that is
        hydraulically connected, which in reality is only some of it. Vertical
        resolution is inherited from SRTM and returned in the payload so a
        caller can judge whether the question is answerable at their margin.

        Rainfall intensity/duration to flood probability is deliberately not
        implemented: it needs an agreed hydrological model basis, and
        coefficients that look authoritative without being validated are worse
        than no output.
      parameters:
        - name: south
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: north
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: west
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: east
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: level_m
          in: query
          description: Water surface elevation in metres above sea level.
          schema: { type: number, minimum: -500, maximum: 9000 }
        - name: grid_size
          in: query
          description: Cells per axis of the returned depth grid.
          schema: { type: integer, minimum: 4, maximum: 256, default: 64 }
      responses:
        '200':
          description: Depth grid with per-level coverage, extent polygons, and model limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/FloodDepthGrid'
        '400':
          description: Invalid bounds, grid size, or water level
  /api/v1/road-access:
    get:
      summary: Road passage status against current hazards
      description: |
        One record per road asset whether or not it is obstructed, so "clear" is
        an observable state rather than an absence.

        A hazard obstructs a road when the road falls inside a hazard-scale
        bounding box, or within the block radius of the reported centre. Bounding
        boxes wider than about 5 degrees are administrative extents rather than
        inundation footprints and fall back to proximity matching, so a
        country-level alert cannot restrict distant roads.
      responses:
        '200':
          description: Road access records and a summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoadAccess'
                  summary:
                    $ref: '#/components/schemas/RoadAccessSummary'
  /api/v1/road-access/summary:
    get:
      summary: Road access counts and cut-off rate
      responses:
        '200':
          description: Aggregate road access summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  summary:
                    $ref: '#/components/schemas/RoadAccessSummary'
  /api/v1/food-security:
    get:
      summary: IPC acute food insecurity classifications
      description: |
        IPC phase classifications (national and subnational) relayed verbatim
        from the HDX dataset. IPC is an analytical classification by National
        IPC Technical Working Groups: not an observation, not an estimate by
        this platform, and Phase thresholds carry triggering consequences under
        famine and anticipatory-action policy.

        The phase `Percentage` column is a fraction of the analysed population:
        `0.2` means 20%. Coordinates are null; geometry is a bounding box where
        the dataset GeoJSON matched the area name — a bbox includes
        neighbouring ground the classification does not cover.

        `data` is one page and carries `PaginationMeta` beside it; `summary` is
        computed over every record that matched the filters, not over the page.
        Page with `?cursor=` — a small `limit` does not change the roll-up.
      responses:
        '200':
          description: Food security records and a summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      success: { type: boolean }
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FoodSecurityRecord'
                      summary:
                        $ref: '#/components/schemas/FoodSecuritySummary'
  /api/v1/food-security/summary:
    get:
      summary: Phase 3+ roll-up, latest published window per country/area
      responses:
        '200':
          description: Countries, and the worst ten areas by current-window Phase 3+ fraction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodSecuritySummary'
  /api/v1/river-discharge:
    get:
      summary: Latest modelled river discharge per region (map overlay roll-up)
      description: |
        One current point per region from the GloFAS v4 series stored by
        `open_meteo_flood`: latest non-null daily value, with its date. This
        is modelled discharge, not gauged observation, and every record and
        the roll-up both say so.

        Empty on a fresh deployment (`data: []`, `as_of: null`) — that is the
        normal state before an ingest, not an error.
      responses:
        '200':
          description: Latest discharge per region
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        region_name: { type: string }
                        latitude: { type: ['number', 'null'] }
                        longitude: { type: ['number', 'null'] }
                        river_discharge_m3s: { type: ['number', 'null'] }
                        date: { type: ['string', 'null'] }
                        as_of: { type: ['string', 'null'] }
                        band: { type: ['string', 'null'] }
                        model_limit: { type: ['string', 'null'] }
                  as_of: { type: ['string', 'null'] }
                  note: { type: string }
  /api/v1/disease-observations:
    get:
      summary: WHO GHO outbreak indicators, national-annual aggregates
      description: |
        Decision-support context with attribution; not district evidence and
        not an alert trigger. The source reports COUNTRY/YEAR, so coordinates
        are null and nothing here is evidence about a district. Series that
        stopped publishing are marked stale in the summary — silence may mean
        absence of published data, not absence of disease.

        `data` is one page and carries `PaginationMeta` beside it; `summary` is
        computed over every record that matched the filters, so `series_state`
        names every indicator that matched rather than the ones that happened to
        fit the page. Page with `?cursor=`.

        Sources: `who_gho` national-annual aggregates (coordinates null) and
        `reliefweb_epidemics` event records (ADR-014: subnational coordinates
        where ReliefWeb publishes them, otherwise a country centroid placed
        with `granularity: 'national'`).

        `?map=1` returns the narrow shape the map layer consumes: only records
        with finite coordinates, each carrying its honesty fields
        (`granularity`, `location_name`, `cases`, `deaths`, `observed_at`,
        `source_url`, `note`), and `as_of` = the latest `observed_at` in the
        collection. Records without geometry (including every who_gho row) are
        absent here but present on the paged default — nothing an operator
        could read in the detail dialog is hidden by the geometry filter.
      responses:
        '200':
          description: Disease observation records and a summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationMeta'
                  - type: object
                    properties:
                      success: { type: boolean }
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/DiseaseObservation'
                      summary:
                        $ref: '#/components/schemas/DiseaseObservationsSummary'
  /api/v1/flood-probability/train:
    post:
      summary: Train the empirical rainfall-flood model per pilot district
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                regions:
                  type: array
                  description: Districts to train; defaults to the pilot regions.
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      country: { type: string }
                      lat: { type: number }
                      lon: { type: number }
                label_source:
                  type: string
                  enum: [gdacs_archive, glofas_discharge]
                  default: gdacs_archive
                  description: |
                    Label basis. gdacs_archive labels months where a reported
                    flood fell within 150 km in the same calendar month;
                    glofas_discharge labels months where GloFAS v4 river
                    discharge at the district's river cell (open_meteo_flood
                    series) is above that cell's 95th-percentile of monthly
                    maxima. Both carry their condition in the model card.
      description: |
        Fits the empirical co-occurrence model (contingency counts plus an
        L2-regularised logistic fit, leave-one-year-out validated) from
        open_meteo_archive rainfall series and the selected label source
        (GDACS flood events by default, or an open_meteo_flood discharge
        series) already in the store. No network calls.

        Refusals are per district with a reason — fewer than 60 months of
        valid features, fewer than 5 flood months, all-one-class samples, or
        no archive/discharge series. A trained model always carries its basis
        and its reporting condition: P(flood enters the GDACS archive) or,
        for the discharge label, P(the GloFAS reanalysis shows a flood-level
        discharge month), not the physical flood rate at a given elevation.
      responses:
        '200':
          description: Trained models and refusals
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FloodProbabilityModel'
                  refusals:
                    type: array
                    items:
                      type: object
                      properties:
                        region: { type: string }
                        refusal: { type: string }
                        months_kept: { type: integer, nullable: true }
                        events_matched: { type: integer, nullable: true }
  /api/v1/flood-probability/score:
    get:
      summary: Score rainfall statistics against a trained flood-probability model
      description: |
        Uses the most recent trained model for the requested region (or the
        newest overall). Without a trained model the response is
        `scored: false` with the refusal text — a refusal is an answer, not a
        500. Every score carries the full model card, leave-one-year-out
        scores, and the reporting condition.
      parameters:
        - { name: max_7_day, in: query, required: true, schema: { type: number }, description: Largest 7-day precipitation total inside the month (mm) }
        - { name: sum_30_day, in: query, required: true, schema: { type: number }, description: Trailing 30-day precipitation total at month end (mm) }
        - { name: sum_90_day, in: query, required: true, schema: { type: number }, description: Trailing 90-day precipitation total at month end (mm) }
        - { name: region, in: query, required: false, schema: { type: string }, description: District name; default the newest trained model overall }
      responses:
        '200':
          description: Scored probability with model card, or an explicit refusal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  scored: { type: boolean }
                  refusal: { type: string, nullable: true }
                  basis: { type: object, nullable: true, description: The frozen MODEL_BASIS object when a model exists }
                  data:
                    $ref: '#/components/schemas/FloodProbabilityScore'
        '400':
          description: Missing or non-numeric rainfall features
  /api/v1/flood-probability/models:
    get:
      summary: Trained flood-probability models, refusals included
      responses:
        '200':
          description: Stored trained models
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FloodProbabilityModel'
  /api/v1/routing/plan:
    post:
      summary: Plan delivery routes over current road access
      description: |
        Dijkstra over imported road assets, respecting access status.

        Endpoints are **road asset ids**, not coordinates; see
        `GET /api/v1/service-assets?service_type=road`. An impassable segment is
        removed from the graph entirely rather than penalised, because no finite
        cost is a barrier. A plan that cannot reach every destination reports
        `fully_deliverable: false` with a plain-language caveat rather than
        quietly returning a straight line.

        Bridges, culverts, ferry crossings, seasonal causeways, and load limits
        are not modelled unless the operator imports them as assets. Every leg
        reports the road classes it relied on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingPlanInput'
      responses:
        '200':
          description: Route plan with per-leg legs and a coverage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    $ref: '#/components/schemas/RoutingPlan'
        '400':
          description: Missing endpoints, endpoints that are not road asset ids, or an unsatisfiable request
