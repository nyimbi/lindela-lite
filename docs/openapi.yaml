openapi: 3.1.0
info:
  title: Lindela Lite API
  version: 0.2.0
  description: Public API for climate-conflict, flood-risk, service-impact, and source-ingestion data.
servers:
  - url: http://127.0.0.1:4177
security:
  - bearerAuth: []
paths:

  /api/v1/kpi/quarterly.md:
    get:
      summary: Quarterly export carrying its own narrative
      description: |
        What was measured and with how many source references, what was refused
        and the reason each module gave, and what the export does not support —
        above the body, because a reader who stops after the first screen should
        already have met the refusals.

        A withheld figure prints as "not measured", never as a dash in a column
        of numbers. The refusal vocabulary is imported from `MODEL_BASIS` rather
        than retyped, so a quoted refusal cannot drift from the code.
      tags: [kpi]
      security: [{ apiKey: [] }]
      parameters:
        - name: quarter
          in: query
          schema: { type: string, example: Q4 }
        - name: year
          in: query
          schema: { type: integer, example: 2026 }
      responses:
        '200':
          description: Markdown export
          content:
            text/markdown:
              schema: { type: string }

  /api/v1/calibration/by-region:
    get:
      summary: Per-region trust, or the reason it was not computed
      summary_note_removed: true
      description: |
        How far this system's predictions have sat from what was subsequently
        observed, per region.

        A region with too few resolved alerts returns `trust: null` and a
        reason. Below thirty resolved alerts a score would read as a
        measurement rather than as an absence of one, so none is given.
      tags: [analytics]
      security: [{ apiKey: [] }]
      parameters:
        - name: region
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Trust per region, with the refusal count
          content:
            application/json:
              schema: { type: object }

  /api/v1/model-drift:
    get:
      summary: Whether the relationships the model relies on still hold
      description: |
        Population-stability drift on the inputs, plus predicted-versus-observed
        divergence, per region.

        Four verdicts, and `not_measurable` is a first-class answer rather than a
        zero. Drift is never reported from a single observation, and divergence
        is only reported when the observed rate's Wilson interval excludes the
        predicted mean — eight events cannot support a claim about drift.
      tags: [analytics]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Per-region drift verdicts
          content:
            application/json:
              schema: { type: object }

  /api/v1/explain/{id}:
    get:
      summary: Where a computed number came from
      description: |
        The record, everything the store knows about how it arrived — the source
        run, the lineage row — and the limits it declares about itself.

        A record that names no source run still returns 200 with `provenance.known
        false` and a sentence saying so. Absence of provenance is a fact about
        the record, not a reason to withhold it, and a bare null would read as
        "we did not look".

        The chain of reasoning is rendered in the browser by `explainRecord`, so
        there is one implementation of it rather than a server copy that drifts.
      tags: [analytics]
      security: [{ apiKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string, default: risk_scores }
          description: Which collection the id belongs to
      responses:
        '200':
          description: The record, its provenance and its declared limits
          content:
            application/json:
              schema: { type: object }
        '404':
          description: No such record in that collection

  /api/v1/rapidpro/reply:
    post:
      summary: Record a reply to an alert sent over SMS
      description: |
        The acknowledgement half of two-way SMS. Behind the same webhook
        verification as a field report: a reply that can close an SLA is
        attacker-controlled input, so the dispatch is correlated by sender
        address within a bounded window and never by a payload-supplied
        alert_event_id.

        An uncorrelated reply is still stored, and answered 202 rather than
        200. Dropping it would make a wrong sender number invisible.
      tags: [rapidpro]
      security: [{ rapidproWebhook: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, text]
              properties:
                from: { type: string, description: Sender URN or phone number }
                text: { type: string }
                alert_event_id: { type: string, description: Used only when the sender is known }
      responses:
        '200':
          description: Correlated to a dispatch and reconciled
          content:
            application/json:
              schema: { type: object }
        '202':
          description: Recorded but not correlated to any dispatch in the window
        '401': { description: Invalid webhook signature }

  /api/v1/rapidpro/delivery:
    get:
      summary: Delivery and acknowledgement state per recipient
      description: |
        What is known about each recipient, and — as important — what is not.
        The RapidPro v2 API gives no per-recipient receipt, so status stops at
        `accepted_by_gateway`. Anything beyond that would be a claim the system
        cannot support.
      tags: [rapidpro]
      security: [{ apiKey: [] }]
      parameters:
        - name: alert_event_id
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Delivery report
          content:
            application/json:
              schema: { type: object }

  /api/v1/rapidpro/escalations:
    get:
      summary: Alert dispatches whose acknowledgement window has closed
      description: |
        Only for dispatches the gateway accepted, so our own outage cannot
        escalate. The clock runs from the first page for an alert rather than
        the last, and any reply counts as a response whether or not its verb
        was recognised.
      tags: [rapidpro]
      security: [{ apiKey: [] }]
      parameters:
        - name: within_minutes
          in: query
          schema: { type: integer, description: Widen or narrow the window }
      responses:
        '200':
          description: Escalations due now
          content:
            application/json:
              schema: { type: object }

  /api/v1/audit/verify:
    get:
      summary: Verify the hash-chained action log
      description: |
        Recomputes the chain from the entries themselves rather than comparing
        stored linkage fields, which a consistently re-chained file would pass.

        Supply `head` — a value published out of band — to anchor the check. A
        chain verified without one reports `unanchored` rather than claiming to
        have been verified: internal consistency is not proof.
      tags: [audit]
      security: [{ apiKey: [] }]
      parameters:
        - name: head
          in: query
          schema: { type: string }
          description: Published head hash to anchor the chain against
      responses:
        '200':
          description: Verification result, with defects and advisories
          content:
            application/json:
              schema: { type: object }

  /api/v1/audit/head:
    get:
      summary: Current chain head, to publish out of band
      tags: [audit]
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Head hash of the action log
          content:
            application/json:
              schema: { type: object }
  /api/v1/analytics/bias-correct:
    post:
      summary: Re-run the bias correction over stored climate observations
      operationId: postanalytics_bias-correct
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/chw/reply:
    post:
      summary: Record a community health worker reply to an alert
      operationId: postchw_reply
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/chw/report:
    post:
      summary: Create a field report from a community health worker
      operationId: postchw_report
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/community-feedback:
    get:
      summary: List or create community feedback
      operationId: getcommunity-feedback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
    post:
      summary: List or create community feedback
      operationId: postcommunity-feedback
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/community-feedback/summary:
    get:
      summary: Community feedback summary by sentiment and district
      operationId: getcommunity-feedback_summary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/connectors:
    get:
      summary: Connector catalog, including each connector validation spec
      operationId: getconnectors
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/connectors/status:
    get:
      summary: Per-connector enablement gate, last run status, and the reason a gated-off connector is off
      operationId: getconnectors_status
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/data-lineage:
    get:
      summary: Record and read source lineage for ingested data
      operationId: getdata-lineage
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/equity/breaches:
    get:
      summary: Detected equity breaches
      operationId: getequity_breaches
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/equity/by-district:
    get:
      summary: Dispatch acknowledgement by district
      operationId: getequity_by-district
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/equity/scan:
    post:
      summary: Scan for equity breaches and raise audit workflows
      operationId: postequity_scan
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/impact/population-at-risk:
    get:
      summary: Population at risk from current hazards
      operationId: getimpact_population-at-risk
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/kpi/quarterly:
    get:
      summary: Quarterly KPI snapshot (JSON, or .pdf for a rendered report)
      operationId: getkpi_quarterly
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/maintenance/apply-retention:
    post:
      summary: Apply the configured retention policy
      operationId: postmaintenance_apply-retention
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/outbox:
    get:
      summary: Pending outbox events
      operationId: getoutbox
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/outbox/dispatch:
    post:
      summary: Dispatch pending outbox events
      operationId: postoutbox_dispatch
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/parametric-disbursements:
    get:
      summary: List parametric disbursements
      operationId: getparametric-disbursements
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/parametric-rules:
    get:
      summary: List or create parametric disbursement rules
      operationId: getparametric-rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
    post:
      summary: List or create parametric disbursement rules
      operationId: postparametric-rules
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/parametric-rules/{id}:
    delete:
      summary: Remove a parametric disbursement rule
      description: >-
        Removes the rule. The removed rule is written whole to the action log,
        so the audit chain records what was in force rather than that something
        was. Simulated disbursements already recorded against the rule are kept.
      operationId: deleteparametric-rules_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the parametric-rules record.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '404':
          description: No such rule
    patch:
      summary: Update a parametric disbursement rule
      operationId: patchparametric-rules_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the parametric-rules record.
  /api/v1/parametric-rules/{id}/simulate:
    post:
      summary: Simulate a parametric rule without disbursing
      operationId: postparametric-rules_id_simulate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the parametric-rules record.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/scenarios:
    post:
      summary: Create a shareable scenario
      operationId: postscenarios
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/scenarios/{id}:
    get:
      summary: Resolve a scenario by its share token
      operationId: getscenarios_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the scenarios record.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/trigger-protocols:
    get:
      summary: List pre-authorised trigger protocols
      operationId: gettrigger-protocols
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/trigger-protocols/{id}/backtest:
    post:
      summary: Backtest a trigger protocol
      operationId: posttrigger-protocols_id_backtest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the trigger-protocols record.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/trigger-protocols/{id}/shadow-run:
    post:
      summary: Shadow-run a trigger protocol
      operationId: posttrigger-protocols_id_shadow-run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the trigger-protocols record.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/trigger-protocols/run:
    post:
      summary: Execute the pre-authorised trigger protocols
      description: >-
        Evaluates every trigger protocol against the live metric context and
        executes the playbooks of those that fire. A live protocol whose alert
        is already open is not re-raised; a shadow protocol records what would
        have fired and does nothing else. Pass dry_run to receive the full plan
        without writing anything.
      operationId: posttrigger-protocols_run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  description: Return the plan and write nothing.
                  default: false
                actor:
                  type: string
                  description: Claimed actor, recorded as a claim when unauthenticated.
      responses:
        '200':
          description: Dry run — the plan, and nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  dry_run: { type: boolean }
                  data:
                    type: object
                    properties:
                      executions:
                        type: array
                        items: { $ref: '#/components/schemas/ProtocolExecution' }
        '201':
          description: Executed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  dry_run: { type: boolean }
                  data:
                    type: object
                    properties:
                      executions:
                        type: array
                        items: { $ref: '#/components/schemas/ProtocolExecution' }
  /api/v1/school-attendance:
    get:
      summary: List school attendance observations
      description: >-
        Paged list with an enrolment-weighted attendance rate. The rate is
        weighted rather than a mean of per-school rates, because averaging
        rates would let a school of nine children count as much as one of nine
        hundred.
      operationId: getschool-attendance
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          overall_rate:
                            type: number
                            nullable: true
                            description: Null when nothing has been ingested.
                          districts:
                            type: object
                            additionalProperties: { type: number, nullable: true }
                          schools: { type: integer }
    post:
      summary: Record a school attendance observation
      operationId: postschool-attendance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchoolAttendanceInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: object }
        '400':
          description: The observation failed validation and nothing was written.
  /api/v1/iot-observations:
    get:
      summary: List IoT sensor readings
      description: >-
        Three shapes on one path. The default is a paged list. `map=1` returns
        the latest reading per sensor that has coordinates — what the map layer
        draws. `sensor_type=X` adds a summary of the latest reading per sensor
        of that type, and `above=N` narrows it to those breaching N.
      operationId: getiot-observations
      parameters:
        - name: map
          in: query
          required: false
          schema: { type: string, enum: ['1'] }
          description: Latest reading per sensor with coordinates.
        - name: sensor_type
          in: query
          required: false
          schema: { type: string, enum: [cold_chain, flood_gauge, heat, humidity, water_point] }
        - name: above
          in: query
          required: false
          schema: { type: number }
          description: With sensor_type, counts only readings above this value.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ListResponse'
                  - type: object
                    properties:
                      summary:
                        type: object
                        nullable: true
                        description: Present only when sensor_type is supplied.
    post:
      summary: Record one or many IoT readings
      description: >-
        Accepts a single reading or `{ readings: [...] }`. A partial batch is
        rejected as a unit — a half-written batch is how a gateway and the
        store come to disagree about what was recorded.
      operationId: postiot-observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/IotObservationInput'
                - type: object
                  required: [readings]
                  properties:
                    readings:
                      type: array
                      minItems: 1
                      items: { $ref: '#/components/schemas/IotObservationInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  count: { type: integer }
                  data: { type: object }
        '400':
          description: One reading in the batch failed and the whole batch was rejected.
  /api/v1/field-outcomes:
    get:
      summary: List confirmed field actions
      description: >-
        One row per responder confirmation that a requested field action
        happened — supplies arrived, vaccine safe, clinic triaged, children fed.
        Distinct from a dispatch: a dispatch is a message the gateway accepted,
        a field outcome is a person reporting they did the thing. The two are not
        comparable and neither is a proxy for the other.
      operationId: getfield-outcomes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/field-outcomes/summary:
    get:
      summary: Warning-to-field-action latency
      description: >-
        The median hours from an alert being raised to a responder confirming the
        action, with the sample count and the basis. Below five confirmations this
        returns a refusal sentence and NO median — a dashboard that received null
        would render a dash, and a dash reads as either "zero hours" or "no
        data". The refusal is the honest answer and it arrives as a sentence.
      operationId: getfield-outcomes_summary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  by_outcome_code:
                    type: object
                    additionalProperties: { type: integer }
                  samples:
                    type: integer
                    description: Confirmations that could actually be timed.
                  median_hours:
                    type: number
                    description: >-
                      Absent, with `refusal` present instead, when there are
                      fewer than five timed confirmations.
                  basis:
                    type: string
                    description: >-
                      What the figure measured and what it is not. Present only
                      when a median is reported.
                  refusal:
                    type: string
                    description: Present only when no median is reported.
  /api/v1/protocol-executions:
    get:
      summary: List protocol execution records
      description: >-
        One row per protocol evaluation that produced something — a fired live
        protocol or any shadow evaluation. A live protocol whose condition
        persists while its alert is open writes nothing, so silence here means
        "the condition persists and the action is already running".
      operationId: getprotocol-executions
      parameters:
        - name: protocol_id
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/protocol-executions/summary:
    get:
      summary: Summarise protocol executions
      operationId: getprotocol-executions_summary
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  last_24h: { type: integer }
                  by_status:
                    type: object
                    additionalProperties: { type: integer }
                  latest_per_protocol:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        execution_id: { type: string }
                        status:
                          type: string
                          enum: [executed, partial, refused, shadow]
                        fired_at: { type: string, format: date-time }
                        observed_value: { type: number }
                        would_fire: { type: boolean }
  /api/v1/webhooks:
    get:
      summary: List or create webhook subscriptions
      operationId: getwebhooks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
    post:
      summary: List or create webhook subscriptions
      operationId: postwebhooks
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/webhooks/{id}:
    patch:
      summary: Update a webhook subscription
      operationId: patchwebhooks_id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            description: >-
              Identifier of the webhooks record.
  /api/v1/health:
    get:
      summary: Service health, storage mode, and whether the pipeline is running
      responses:
        '200':
          description: Health payload. Also returned when the pipeline has never completed a cycle (`status: starting`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: >-
            The store answered but the periodic pipeline has gone stale. The
            process is up and serving; the work it exists to do has stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/sources:
    get:
      summary: Source catalog and freshness
      responses:
        '200':
          description: Source list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
  /api/v1/ingest/run:
    post:
      summary: Run one or more source ingestors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sources:
                  type: array
                  items:
                    type: string
                regions:
                  type: array
                  items:
                    $ref: '#/components/schemas/Region'
      responses:
        '200':
          description: Ingestion result
  /api/v1/ingest/status:
    get:
      summary: Per-source ingestion health and schedule status
      description: >-
        Each entry carries a `cadence` block: when the schedule is next due, and
        how late the last scheduled run started. `slipping` is true when that
        lateness exceeds one interval, so a source that cannot hold its cadence
        says so rather than reporting an `ok` that only means "it ran".
      responses:
        '200':
          description: Ingestion source health
  /api/v1/ingest/schedules:
    get:
      summary: List ingestion schedules
      responses:
        '200':
          description: Ingestion schedules
    post:
      summary: Create an ingestion schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionScheduleInput'
      responses:
        '201':
          description: Ingestion schedule created
  /api/v1/ingest/schedules/defaults:
    post:
      summary: Create default public-source ingestion schedules
      responses:
        '201':
          description: Default ingestion schedules created
  /api/v1/ingest/schedules/{id}:
    get:
      summary: Get an ingestion schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingestion schedule
    patch:
      summary: Update an ingestion schedule
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Ingestion schedule updated
  /api/v1/ingest/schedules/{id}/run:
    post:
      summary: Run one ingestion schedule immediately
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Ingestion schedule run recorded
  /api/v1/ingest/run-due:
