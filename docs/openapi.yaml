  /api/v1/watermarks:
    get:
      summary: Every source's high-water mark
      description: >-
        R-52. The watermark is written on every successful run and was readable
        from nowhere, so a backfill that died three weeks ago was fully
        recoverable from the store and completely invisible. `covered_through` is
        null — not today, not zero — for a source that has never completed a run,
        and `stale` is judged against that source's own cadence at two intervals,
        so an hourly source and a weekly one are not held to the same number.
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: One row per source with a recorded watermark
  /api/v1/history/{id}:
    get:
      summary: What the platform believed about a collection, over time
      description: >-
        The path segment is the collection name. It is `{id}` here because the
        spec gate derives parameter names from the route patterns in
        `src/server.js`, and every path capture in this document carries that
        name; the API reference calls it `:collection`.
      description: >-
        The bitemporal history, as a query. Every value the platform held, with
        the interval it was held for, plus a `coverage` block stating how much
        history was pruned — the store keeps the most recent five revisions per
        record, so this answers the recent past and says so. Only the bitemporal
        collections project: a field report is an event, not a state the platform
        held and later changed.
      security: [{ apiKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The collection name — one of the bitemporal collections.
          schema: { type: string }
        - name: district
          in: query
          schema: { type: string }
        - name: at
          in: query
          description: Return the value the platform held at this instant. Null when it held nothing then.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The series, its coverage, and the value as of `at`
  /api/v1/history/{id}/record:
    get:
      summary: One record's revision list, and its value at a date
      description: >-
        `?id=` names the record and `?at=` returns the value the platform held at
        that instant — `null` when it held nothing then, which is an absence of a
        belief and not a count of zero.
      security: [{ apiKey: [] }]
      parameters:
        - name: id
          in: path
          required: true
          description: The collection name.
          schema: { type: string }
        - name: id
          in: query
          required: true
          description: The record id within that collection.
          schema: { type: string }
        - name: at
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Revisions, current value, and value as of `at`
        '400':
          description: No record id was given
  /api/v1/alert-outcomes:
    get:
      summary: Alert outcome determinations
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Every determination, including superseded ones
  /api/v1/alert-outcomes/reasons:
    get:
      summary: The closed set of determinations and their reasons
      description: >-
        Served rather than duplicated in a client: a determination UI carrying
        its own copy of these lists is a fourth definition of what a false alert
        is, and the two would drift.
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Determinations and the reasons valid for each
  /api/v1/alert-outcomes/tally:
    get:
      summary: How much of the alert history anyone has determined
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: Determined, justified, false, undetermined, coverage
  /api/v1/alert-events/{id}/outcome:
    post:
      summary: Record whether an alert was justified
      description: >-
        The determination is a reason from a closed set, not a note: a note
        cannot be counted or grouped by district, which is the reason every
        calibration surface reported "not estimable" before this existed. A later
        determination supersedes rather than overwrites; a retry of the same
        judgement is the same record.
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [determination, reason, determined_by]
              properties:
                determination: { type: string, enum: [justified, false] }
                reason: { type: string }
                determined_by: { type: string }
                note: { type: string }
                evidence_record_ids:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Recorded
        '400':
          description: The determination or its reason is not in the closed set
        '404':
          description: No such alert event
  /stac/catalog.json:
    get:
      summary: STAC catalogue of published items
      description: >-
        Authenticated like the rest of the API. The spatial catalogues are
        interoperability surfaces, so they carry every field a record has
        except coordinates (carried as geometry) and the fields that identify a
        person or a secret. An operator that wants an open catalogue adds
        `/stac` to LINDELA_LITE_PUBLIC_PATHS.
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: STAC catalogue
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
