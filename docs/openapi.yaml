components:
  parameters:
    Country:
      name: country
      in: query
      schema:
        type: string
    Bbox:
      name: bbox
      in: query
      description: west,south,east,north
      schema:
        type: string
    EventType:
      name: event_type
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Status:
      name: status
      in: query
      schema:
        type: string
    Priority:
      name: priority
      in: query
      schema:
        type: string
        enum: [low, medium, high, critical]
    IncidentId:
      name: incident_id
      in: query
      schema:
        type: string
    InterventionId:
      name: intervention_id
      in: query
      schema:
        type: string
  schemas:
    HealthResponse:
      type: object
      required: [success, status, version, counts, sources, exclusions, storage]
      properties:
        success:
          type: boolean
        status:
          type: string
        version:
          type: string
          description: >-
            Released build version, read from package.json at startup. The
            dashboards display this rather than carrying their own literal,
            because a hardcoded version drifted behind the release and would
            report a build that was not the one running.
          example: 0.2.0
        updated_at:
          type: string
        counts:
          type: object
        sources:
          type: array
          items:
            type: string
        exclusions:
          type: array
          items:
            type: string
        storage:
          type: object
          properties:
            mode:
              type: string
              enum: [json, pg0, postgres, custom]
    ListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
    Region:
      type: object
      required: [name, country, lat, lon]
      properties:
        name:
          type: string
        country:
          type: string
        lat:
          type: number
        lon:
          type: number
    IngestionScheduleInput:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [open_meteo, gdacs, glofas, chirps, nasa_firms, service_assets, acled_csv, conflict_csv]
        status:
          type: string
          enum: [active, paused, archived]
        interval_minutes:
          type: integer
          minimum: 1
        timeout_ms:
          type: integer
          minimum: 1000
        retries:
          type: integer
          minimum: 0
        stale_after_minutes:
          type: integer
          minimum: 1
        next_run_at:
          type: string
        default_options:
          type: object
    ServiceAssetInput:
      type: object
      required: [name, service_type, country, latitude, longitude]
      properties:
        name:
          type: string
        service_type:
          type: string
          enum: [health, water, road, school, power, telecom, market, other]
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    IncidentInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        incident_type:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        country:
          type: string
        latitude:
          type: number
        longitude:
          type: number
    RapidProDispatchInput:
      type: object
      properties:
        mode:
          type: string
          enum: [flow_start, broadcast]
        urns:
          type: array
          items:
            type: string
        contacts:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        text:
          type: string
    ReportTemplateInput:
      type: object
      required: [name, report_type]
      properties:
        name:
          type: string
        report_type:
          type: string
          enum: [situation_report, incident_brief, intervention_update, data_quality_report, alert_digest]
        title_pattern:
          type: string
        default_filters:
          type: object
        sections:
          type: array
          items:
            type: string
        distribution_defaults:
          type: array
          items:
            type: object
    ReportInput:
      type: object
      properties:
        template_id:
          type: string
        report_type:
          type: string
          enum: [situation_report, incident_brief, intervention_update, data_quality_report, alert_digest]
        scope:
          type: object
        generate:
          type: boolean
        section_ids:
          type: array
          items:
            type: string
    ReportDistributionInput:
      type: object
      properties:
        channels:
          type: array
          items:
            type: object
            properties:
              channel:
                type: string
                enum: [markdown_download, json, csv, geojson, webhook, rapidpro_sms]
              url:
                type: string
              urns:
                type: array
                items:
                  type: string
              contacts:
                type: array
                items:
                  type: string
              groups:
                type: array
                items:
                  type: string
    ReportScheduleInput:
      type: object
      required: [template_id]
      properties:
        template_id:
          type: string
        timezone:
          type: string
        recurrence:
          type: object
        next_run_at:
          type: string
        auto_distribute:
          type: boolean
    FloodDepthGrid:
      type: object
      description: |
        Depth grid for one water surface elevation. `model` states the
        limitation in the payload itself so a caller can judge answerability
        without reading the docs.
      required: [bounds, size, level_m, depth_grid, model, vertical_resolution_m]
      properties:
        bounds:
          type: object
          properties:
            south: { type: number }
            west: { type: number }
            north: { type: number }
            east: { type: number }
        size:
          type: integer
          description: Cells per axis; depth_grid is row-major and north-first.
        zoom:
          type: integer
          description: Terrain tile zoom used, lowered automatically when the tile budget is exceeded.
        level_m:
          type: number
        levels_m:
          type: array
          items: { type: number }
        coverage_pct:
          type: number
          description: Share of cells with terrain data, not share flooded.
        elevation_range_m:
          type: object
          properties:
            min: { type: number }
            max: { type: number }
        per_level:
          type: array
          description: Flooded cells, coverage, and area per requested level.
          items:
            type: object
            properties:
              level_m: { type: number }
              flooded_cells: { type: integer }
              coverage_pct: { type: number }
              area_sq_km: { type: number }
        depth_grid:
          type: array
          description: Cell depth in metres; null where terrain data is void.
          items:
            type: number
            nullable: true
        extent_geojson:
          type: object
          description: Coarse inundated-extent polygons, one per contiguous run per row.
        vertical_resolution_m:
          type: number
        source:
          type: string
        model:
          type: string
          description: Always states that flow routing and storage are not modelled.
        generated_at:
          type: string
    RiskScore:
      type: object
      description: |
        Decision-support signal. The band fields are a **sensitivity range
        driven by input coverage, not a calibrated predictive distribution**.
        `calibrated_uncertainty` is false and `limits` says so in the payload.
        A zero-width band means inputs were sufficient, not that the outcome is
        certain.
      required: [type, region_name, score, calibrated_uncertainty, limits]
      properties:
        type:
          type: string
          enum: [flood_risk, climate_conflict_risk]
        region_name: { type: string }
        country: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        score: { type: number, minimum: 0, maximum: 100 }
        sensitivity_low: { type: number }
        sensitivity_mid: { type: number }
        sensitivity_high: { type: number }
        sensitivity_width:
          type: number
          description: Zero means input coverage was sufficient, not that uncertainty is absent.
        calibrated_uncertainty:
          type: boolean
          enum: [false]
          description: No calibrated bands ship with this release; no Brier or CRPS calibration report exists.
        score_p10:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_low. Retained so existing consumers keep working.
        score_p50:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_mid.
        score_p90:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_high.
        interval_width:
          type: number
          deprecated: true
          description: Legacy alias for sensitivity_width.
        risk_level:
          type: string
        confidence:
          type: number
          description: Input-coverage score, not a calibrated probability.
        drivers: { type: object }
        methodology: { type: string }
        limits: { type: string }
        generated_at: { type: string }
    RoadAccess:
      type: object
      required: [road_id, access_status]
      properties:
        id: { type: string }
        road_id: { type: string }
        road_name: { type: string }
        road_class:
          type: string
          enum: [trunk, primary, secondary, tertiary, unpaved, track]
        country: { type: string }
        admin1: { type: string, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        access_status:
          type: string
          enum: [passable, restricted, impassable]
        access_reason:
          type: string
          description: Plain-language cause, so "clear" is distinguishable from "not assessed".
        access_score:
          type: number
          description: 0-100, weighted by road class criticality.
        access_level:
          type: string
          enum: [open, constrained, severely_constrained, cut_off]
        reported_passability:
          type: string
          nullable: true
          description: Field-reported status, kept separate from hazard-derived status.
        width_m:
          type: number
          nullable: true
        obstruction_count: { type: integer }
        primary_hazard_type:
          type: string
          nullable: true
        confidence: { type: number }
        generated_at: { type: string }
    RoadAccessSummary:
      type: object
      required: [total_roads, cut_off_rate_pct]
      properties:
        generated_at: { type: string }
        total_roads: { type: integer }
        passable: { type: integer }
        restricted: { type: integer }
        impassable: { type: integer }
        cut_off_rate_pct: { type: number }
        blocked_by_hazard_type:
          type: object
          additionalProperties: { type: integer }
        cut_off_roads:
          type: array
          items:
            type: object
            properties:
              road_id: { type: string }
              road_name: { type: string }
              road_class: { type: string }
              reason: { type: string }
              primary_hazard_type: { type: string, nullable: true }
    RoutingPlanInput:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Road asset id of the distribution origin.
        to:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          description: One or more destination road asset ids.
        link_radius_km:
          type: number
          description: Max distance at which two road segments are treated as connected.
          default: 5
        max_minutes:
          type: number
          description: Drop legs exceeding this budget rather than reporting them as reachable.
    RoutingPlan:
      type: object
      required: [from, network, legs, summary, fully_deliverable]
      properties:
        from: { type: object }
        network:
          type: object
          properties:
            roads: { type: integer }
            links: { type: integer }
            link_radius_km: { type: number }
            cut_off_roads:
              type: integer
              description: Impassable nodes, whose links are removed from the graph entirely.
        legs:
          type: array
          items:
            type: object
            properties:
              to: { type: object }
              feasible: { type: boolean }
              reason:
                type: string
                nullable: true
                description: Present when infeasible; names the severed segment rather than failing silently.
              mode:
                type: string
                enum: [vehicle, foot]
              total_minutes: { type: number }
              total_distance_km: { type: number }
              hops:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    road_class: { type: string }
                    access_status: { type: string }
              road_classes:
                type: array
                items: { type: string }
              restricted_hops: { type: integer }
              degraded:
                type: boolean
                description: True when the route relies on a restricted segment.
              blocked_by: { type: string, nullable: true }
              severed_by:
                type: array
                description: Cut-off segments plausibly responsible for the severance.
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    blocked_by: { type: string, nullable: true }
              reachable_from_origin:
                type: array
                description: Other roads reachable from the origin but not connecting onward.
                items: { type: string }
              suggestion: { type: string, nullable: true }
        summary:
          type: object
          properties:
            destinations: { type: integer }
            reachable: { type: integer }
            unreachable: { type: integer }
            coverage_pct: { type: number }
            total_minutes: { type: number }
            total_distance_km: { type: number }
            any_degraded: { type: boolean }
            requires_foot: { type: integer }
            blocked_by:
              type: object
              additionalProperties: { type: integer }
        fully_deliverable:
          type: boolean
          description: False when any destination is unreachable. A plan that cannot reach every site is not a plan.
        caveat:
          type: string
          nullable: true
