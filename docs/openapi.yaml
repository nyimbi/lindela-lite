      description: >-
        Carries every dashboard section, plus a cover sheet listing what the file
        contains and the narrative page of measured claims, refusals and limits.
        A figure that could not be measured is printed with the reason, never as
        a zero. The lag section measures queued_at to sent_at and the KPI tile
        measures matched_signal_at to sent_at; the export prints which interval
        produced which figure.
      parameters:
        - in: query
          name: quarter
          schema: { type: string, enum: [Q1, Q2, Q3, Q4] }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /api/v1/kpi/quarterly/coverage:
    get:
      summary: Which dashboard sections the quarterly PDF carries
      description: >-
        The dashboard renders seven sections. This states how many the export
        carries and names any that are omitted, so a reader can be told before
        the download rather than discovering the omission afterwards. Generated
        from the same declaration the PDF renderer uses.
      responses:
        '200':
          description: Section coverage
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  carried: { type: integer }
                  titles: { type: array, items: { type: string } }
                  missing: { type: array, items: { type: string } }
                  summary: { type: string }
