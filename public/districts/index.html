<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lindela Districts</title>
    <link rel="manifest" href="/districts/manifest.webmanifest">
    <meta name="theme-color" content="#0e1520">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/components.css">
    <style>
      @import '/tokens.css';

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        min-height: 100vh;
      }

      main {
        padding: 1.25rem;
        /* 1100px capped the grid at four cards on a 1280px screen and left the
           rest of the row empty. The widest thing on the overview is the
           situation row, which bounds its own map and table, so widening the
           container costs nothing there. */
        max-width: 1440px;
        /* `body` is a column flex container, and an auto margin on the cross
           axis cancels the stretch every flex item otherwise gets. That is why
           `main` was 606px wide at 1280, 1024 and 768 alike: the grid was
           never given a viewport to fill, only its own content to hug. The
           margin is still what centres the block at wide widths; `width: 100%`
           is what gives it a width in the first place. */
        width: 100%;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* List page */
      /* auto-fit with a floor, not a fixed column count: the list holds five
         districts today and could hold fifty tomorrow, and a hardcoded count
         either strands 80% of a wide screen or overflows a 360px one.
         min(100%, 17rem) is what keeps a track from outgrowing its container
         when the container is narrower than the floor. Logical throughout, so
         an RTL locale mirrors rather than reflows from the wrong edge. */
      .district-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr));
        gap: var(--sp-3);
        align-items: start;
      }

      /* The shared card treatment (.rule-card in components.css), restated
         here because this page carries its own inline block. Same border,
         radius and background as every other card in the product: a district
         card that looks different reads as a different product. */
      .district-card {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
        padding: var(--sp-3) var(--sp-4);
        border: 1px solid var(--stroke);
        border-radius: var(--r);
        background: var(--bg-elevated);
        color: var(--ink);
        text-decoration: none;
        transition: border-color var(--dur-fast) var(--ease);
      }
      .district-card:hover { border-color: var(--brand); }
      /* The filter hides cards with the attribute; flex would otherwise win. */
      .district-card[hidden] { display: none; }
      .district-card-name { font-weight: 700; font-size: 1.1rem; }
      .district-card-meta { font-size: var(--text-sm); color: var(--ink-muted); }

      .district-card-counts {
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
        margin-block-start: var(--sp-1);
        font-size: var(--text-sm);
        color: var(--ink-muted);
      }
      .district-stat-list {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-1) var(--sp-3);
      }
      .district-stat strong { color: var(--ink); }
      .district-card-latest {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--sp-2);
        color: var(--ink);
        border-block-start: 1px solid var(--stroke);
        padding-block-start: var(--sp-2);
      }

      /* Filter toolbar. Wraps rather than scrolls: a horizontal scrollbar on
         the control that hides half the page is a bad trade for saving 30px. */
      .list-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: var(--sp-3) var(--sp-4);
        padding: var(--sp-3) var(--sp-4);
        border: 1px solid var(--stroke);
        border-radius: var(--r);
        background: var(--bg-elevated);
      }
      .filter-field {
        display: flex;
        flex-direction: column;
        gap: var(--sp-1);
        flex: 1 1 14rem;
      }
      .filter-field label { font-size: var(--text-sm); color: var(--ink-muted); }
      .filter-field input {
        min-height: var(--size-control);
        padding-inline: 0.6rem;
        font-family: var(--font-sans);
        font-size: var(--text-sm);
        color: var(--ink);
        background: var(--bg);
        border: 1px solid var(--stroke-strong);
        border-radius: var(--r);
      }
      .filter-check {
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        min-height: var(--size-control);
        font-size: var(--text-sm);
        cursor: pointer;
      }
      /* 1.6rem, not 1rem: WCAG 2.2 SC 2.5.8 puts the floor at 24 CSS px for the
         control itself, and a checkbox rendered at 16 is under it. */
      .filter-check input {
        width: 1.6rem;
        height: 1.6rem;
        accent-color: var(--brand);
      }
      .list-toolbar-note { margin-inline-start: auto; padding-block-end: 0.3rem; }

      /* The language picker. `end` rather than `right`, so an RTL locale puts
         it where the reader's hand already is instead of mirroring nothing.
         Below the shared navbar's 44px, not over it. */
      .page-locale {
        position: fixed;
        inset-block-start: 3.25rem;
        inset-inline-end: 0.75rem;
        z-index: 60;
      }
      .page-locale select { font-size: var(--text-sm); }

      /* Overview page */
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: var(--ink-muted);
        text-decoration: none;
        font-size: 0.85rem;
        margin-bottom: 0.5rem;
      }
      .back-link:hover { color: var(--ink); }

      .ribbon {
        background: var(--bg-elevated);
        border: 1px solid var(--stroke);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .ribbon-title {
        font-size: 1.4rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .ribbon-subtitle { font-size: 0.85rem; color: var(--ink-muted); }
      .counts-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        font-size: 0.8rem;
        margin-top: 0.25rem;
      }
      .counts-strip span { color: var(--ink-muted); }
      .counts-strip strong { color: var(--ink); }

      /* Sections */
      .section { display: flex; flex-direction: column; gap: 0.75rem; }
      .section-title {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--ink-muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* Hazard table */
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
      th {
        text-align: left;
        padding: 0.35rem 0.6rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--ink-muted);
        border-bottom: 1px solid var(--stroke);
      }
      td {
        padding: 0.35rem 0.6rem;
        border-bottom: 1px solid var(--stroke);
        vertical-align: middle;
      }
      tr:last-child td { border-bottom: none; }

      /* Chips */
      .chip {
        display: inline-block;
        font-size: 0.68rem;
        border-radius: 3px;
        padding: 0 0.4rem;
        line-height: 1.7;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      /* These put white text on the raw severity hue at 0.68rem: measured at
         ~3.2:1 for critical, ~2.5:1 for high and ~2.2:1 for low — three of four
         below the 4.5:1 WCAG AA floor, on the single most operationally urgent
         attribute in the product. The #c0392b-style fallbacks in the old rule
         were accessible, but tokens.css shadows every one of them with a light
         OKLCH value, so the fallbacks could never fire and the accessible
         colours were dead code.

         Severity is now a tint of the hue with the body ink on top: the hue
         still reads at a glance, the text clears the floor, and every surface
         resolves severity the same way. The text label is always present, so
         meaning never depends on colour alone. */
      .chip-critical,
      .chip-high,
      .chip-medium,
      .chip-low,
      .chip-ok {
        color: var(--ink);
        font-size: var(--text-xs);
      }
      .chip-critical { background: color-mix(in oklch, var(--sev-critical) 20%, transparent); box-shadow: inset 0 0 0 1px var(--sev-critical); }
      .chip-high     { background: color-mix(in oklch, var(--sev-high) 20%, transparent);     box-shadow: inset 0 0 0 1px var(--sev-high); }
      .chip-medium   { background: color-mix(in oklch, var(--sev-medium) 20%, transparent);   box-shadow: inset 0 0 0 1px var(--sev-medium); }
      .chip-low      { background: color-mix(in oklch, var(--sev-low) 20%, transparent);      box-shadow: inset 0 0 0 1px var(--sev-low); }
      .chip-ok       { background: color-mix(in oklch, var(--ok) 20%, transparent);          box-shadow: inset 0 0 0 1px var(--ok); }
      .chip-unknown,
      .chip-neutral { background: var(--surface); color: var(--ink-muted); }

      /* Collapsibles */
      .collapsible {
        background: var(--bg-elevated);
        border: 1px solid var(--stroke);
        border-radius: 6px;
        overflow: hidden;
      }
      .collapsible summary {
        padding: 0.6rem 0.875rem;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        list-style: none;
        user-select: none;
      }
      .collapsible summary::-webkit-details-marker { display: none; }
      .collapsible summary::before {
        content: '▶';
        font-size: 0.65rem;
        color: var(--ink-muted);
        transition: transform 0.15s;
      }
      .collapsible[open] summary::before { transform: rotate(90deg); }
      .collapsible-body { padding: 0 0.875rem 0.75rem; }

      /* Record item */
      .record-item {
        border-bottom: 1px solid var(--stroke);
        padding: 0.4rem 0;
        font-size: 0.83rem;
        cursor: pointer;
      }
      .record-item:last-child { border-bottom: none; }
      .record-item summary {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        list-style: none;
        user-select: none;
      }
      .record-item summary::-webkit-details-marker { display: none; }
      .record-item-title { flex: 1; color: var(--ink); }
      .record-full {
        background: var(--bg);
        border-radius: 4px;
        padding: 0.5rem 0.75rem;
        margin-top: 0.35rem;
        font-size: 0.78rem;
        color: var(--ink-muted);
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* KPI tiles */
      .kpi-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .kpi-tile {
        background: var(--bg-elevated);
        border: 1px solid var(--stroke);
        border-radius: 6px;
        padding: 0.75rem 1rem;
        min-width: 160px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }
      .kpi-label { font-size: 0.72rem; color: var(--ink-muted); }
      .kpi-value { font-size: 1.5rem; font-weight: 700; }
      /* Words, not digits: "2 days ago" at 1.5rem wraps onto two lines inside a
         160px tile, and the tile that is meant to be read at a glance becomes
         the one that has to be re-read. */
      .kpi-value.kpi-value-text { font-size: 1.15rem; line-height: 1.3; }
      .kpi-unit { font-size: 0.72rem; color: var(--ink-muted); }

      /* Paged <details> footer. The count of what was withheld sits beside the
         control that reveals it: a truncation with no number reads as the whole
         list, which on a humanitarian surface is the expensive kind of wrong. */
      .list-footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-2);
        margin-block-start: var(--sp-3);
        padding-block-start: var(--sp-3);
        border-block-start: 1px solid var(--stroke);
        font-size: var(--text-sm);
        color: var(--ink-muted);
      }
      .list-footer .btn { min-height: var(--size-control); }
      /* `.btn` sets `display: inline-flex`, and an author `display` beats the UA
         sheet's `[hidden] { display: none }` — so a hidden show-all button
         stayed on screen after the list was already whole. */
      .list-footer .btn[hidden] { display: none; }
      .list-footer:has(> .btn[hidden]) { justify-content: flex-start; }

      /* SVG map */
      .map-inset {
        background: var(--bg-elevated);
        border: 1px solid var(--stroke);
        border-radius: 6px;
        overflow: hidden;
        width: 100%;
        max-width: 420px;
      }
      .map-inset svg { display: block; width: 100%; height: auto; }

      .situation-row {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        align-items: flex-start;
      }
      .situation-table { flex: 1; min-width: 260px; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#app" data-i18n="districts.skip_link">Skip to district content</a>
    <!-- Outside #app on purpose. clearApp() empties that element on every
         route, so a picker placed inside it would survive exactly until the
         first district rendered and then take itself out of the page. -->
    <div class="page-locale">
      <!-- The languages offered here are exactly the ones whose catalogue
           renders every key this page names, which today is English alone.
           Widening the picker without the translations behind it is the
           failure scripts/check-i18n.mjs exists to refuse. -->
      <label for="locale-select" class="visually-hidden" data-i18n="districts.locale_label">Locale</label>
      <select id="locale-select">
        <option value="en">English</option>
      </select>
    </div>
    <main id="app" tabindex="-1" aria-busy="true">
      <!-- Declared here and never re-created by app.js. A live region that the
           render wipes is a live region nobody hears: the element a screen
           reader is observing has to still exist when the text changes. -->
      <p id="app-status" class="visually-hidden" role="status" aria-live="polite"></p>
      <div id="loading-msg" class="loading-note" data-i18n="districts.loading">Loading…</div>
    </main>

    <script type="module">
      import { mountNavbar } from '/shared/navbar.js'
      // Awaited, not raced. `mountNavbar` stamps eight labels through the
      // catalogue, and this module evaluates before app.js has finished
      // fetching it — so mounting here read an empty catalogue and the bar
      // opened as `nav.ops nav.focal_point nav.chw …`. Nothing repaired it:
      // only a locale `change` re-stamped the DOM. After mount the labels carry
      // `data-i18n`, so a locale switch re-renders the bar through
      // `i18n.set() -> applyI18n()` without a re-mount.
      import { ready } from '/districts/app.js'
      await ready
      mountNavbar({ activePath: '/districts' })
    </script>
    <script type="module" src="/districts/app.js"></script>
    <script type="module" src="/shared/demo.js"></script>
</body>
</html>
