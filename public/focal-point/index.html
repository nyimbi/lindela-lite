<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lindela Focal Point</title>
    <link rel="manifest" href="/focal-point/manifest.webmanifest">
    <meta name="theme-color" content="#0e1520">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/components.css">
    <style>
      @import '/tokens.css';

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { font-size: 16px; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        background: var(--bg-elevated);
        border-bottom: 1px solid var(--stroke);
        padding: 1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 600;
        font-size: 1.125rem;
      }

      .header-brand svg {
        width: 24px;
        height: 24px;
      }

      .header-controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      select {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        background: var(--bg);
        color: var(--ink);
        font-size: 0.875rem;
      }

      .signout-btn {
        padding: 0.5rem 1rem;
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 4px;
        color: var(--ink);
        cursor: pointer;
        font-size: 0.875rem;
      }

      .signout-btn:hover {
        background: var(--surface-hover);
      }

      main {
        flex: 1;
        padding: 2rem 1rem;
        max-width: 640px;
        margin: 0 auto;
        width: 100%;
      }

      .pending-queue {
        margin-bottom: 2rem;
      }

      .pending-queue h2 {
        font-size: 1.25rem;
        margin-bottom: 1rem;
      }

      .queue-empty {
        padding: 2rem;
        text-align: center;
        background: var(--surface);
        border-radius: 8px;
        color: var(--ink-muted);
      }

      /* An error state must not look like the empty state it replaced. The
         left rule and the warm ground separate them at a glance, before any
         text is read — the reader who skims is the one who needed stopping. */
      .queue-empty[data-state='error'] {
        text-align: start;
        border-left: 4px solid var(--sev-high);
        background: var(--surface);
      }

      .queue-empty[data-state='error'] p {
        margin: 0.5rem 0 0;
        max-width: 60ch;
      }

      .retry-btn {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--ink-muted);
        border-radius: 6px;
        cursor: pointer;
        min-height: 44px;
      }

      .retry-btn:hover { background: var(--surface-hover); }

      .workflow-card {
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1rem;
      }

      .severity-chip {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      /* These were pastel light-mode chips (#fecaca on #7f1d1d) sitting on a
         oklch(15%) dark page — the only light elements on the screen, and a
         severity scale that matched nothing else in the product. Now they
         resolve to the same --sev-* tokens every other surface uses, so one
         severity reads identically everywhere. */
      .severity-critical { background: color-mix(in oklch, var(--sev-critical) 18%, transparent); color: var(--ink); border-color: var(--sev-critical); }
      .severity-high     { background: color-mix(in oklch, var(--sev-high) 18%, transparent);     color: var(--ink); border-color: var(--sev-high); }
      .severity-medium   { background: color-mix(in oklch, var(--sev-medium) 18%, transparent);   color: var(--ink); border-color: var(--sev-medium); }
      .severity-low      { background: color-mix(in oklch, var(--sev-low) 18%, transparent);      color: var(--ink); border-color: var(--sev-low); }

      .workflow-details {
        margin-bottom: 1rem;
        font-size: 0.9375rem;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }

      .detail-label {
        color: var(--ink-muted);
      }

      .detail-value {
        font-weight: 500;
      }

      .action-buttons {
        display: flex;
        gap: 0.75rem;
      }

      button {
        flex: 1;
        padding: 0.75rem;
        border: none;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        min-height: var(--tap-target-min, 44px);
      }

      /* Approve is the control that releases pre-agreed finance, and it was the
         least legible thing in the product at 2.07:1 — two competing rules
         declared it, and the later one put body ink on a mid-green fill.
         One rule, one pairing, chosen to clear AA. */
      .btn-approve {
        background: var(--ok);
        color: var(--on-ok, oklch(14% 0.02 155));
      }

      .btn-approve:hover {
        background: color-mix(in oklch, var(--ok) 85%, black);
      }

      .btn-reject {
        background: transparent;
        color: var(--danger);
        border-color: color-mix(in oklch, var(--danger) 45%, transparent);
      }

      .btn-reject:hover {
        opacity: 0.9;
      }

      .protocols-section {
        margin-bottom: 2rem;
      }

      .protocols-section h3 {
        font-size: 1.125rem;
        margin-bottom: 1rem;
      }

      .protocol-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem;
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 4px;
        margin-bottom: 0.5rem;
        font-size: 0.9375rem;
      }

      .protocol-name {
        font-weight: 500;
      }

      .protocol-expiry {
        color: var(--ink-muted);
        font-size: 0.875rem;
      }

      .audit-trail {
        margin-bottom: 2rem;
      }

      .audit-trail h3 {
        font-size: 1.125rem;
        margin-bottom: 1rem;
      }

      .audit-item {
        padding: 0.75rem;
        background: var(--surface);
        border: 1px solid var(--stroke);
        border-radius: 4px;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
      }

      .audit-decision {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .audit-detail {
        color: var(--ink-muted);
      }

      dialog {
        border: 1px solid var(--stroke);
        border-radius: 8px;
        background: var(--surface);
        padding: 1.5rem;
        max-width: 90%;
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      .dialog-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
      }

      .dialog-header h2 {
        font-size: 1.25rem;
      }

      .dialog-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--ink-muted);
        font-size: 1.5rem;
        padding: 0;
        min-height: auto;
      }

      .dialog-close:hover {
        color: var(--ink);
      }

      .dialog-body {
        margin-bottom: 1.5rem;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      .form-group label {
        display: block;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }

      .form-group select,
      .form-group input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        background: var(--bg);
        color: var(--ink);
        font-size: 1rem;
      }

      .dialog-actions {
        display: flex;
        gap: 0.75rem;
      }

      .btn-cancel {
        background: var(--surface);
        border: 1px solid var(--stroke);
        color: var(--ink);
      }

      footer {
        padding: 1rem;
        border-top: 1px solid var(--stroke);
        text-align: center;
        font-size: 0.875rem;
        color: var(--ink-muted);
      }

      .offline-banner {
        background: #fef3c7;
        color: #b45309;
        padding: 0.75rem 1rem;
        text-align: center;
        font-size: 0.875rem;
      }

      @media (max-width: 640px) {
        main { padding: 1rem; }
        header { flex-direction: column; gap: 1rem; }
        .header-controls { width: 100%; flex-wrap: wrap; }
        select { width: 100%; }
        .identity-input { flex: 1 1 8rem; }
      }

      /* --- Approval card -----------------------------------------
         The card a focal point approves a trigger from. It now states the
         comparison being made and separates the reading from the threshold,
         because "40 (value: 48)" made the reader do the arithmetic. */
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--sp-2);
        margin-bottom: var(--sp-2);
      }

      .queue-position {
        color: var(--ink-muted);
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
      }

      .workflow-consequence {
        margin-bottom: var(--sp-3);
        padding: var(--sp-3);
        border-inline-start: 3px solid var(--brand);
        background: var(--surface);
        border-radius: 0 var(--r) var(--r) 0;
        color: var(--ink-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }
      .workflow-consequence strong { color: var(--ink); }

      .reading { font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums; margin-inline-end: 0.35rem; }
      .threshold { color: var(--ink-muted); }
      .verdict {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.8125rem;
        font-weight: 600;
      }
      .reading-met .verdict   { color: var(--warn); }
      .reading-unmet .verdict { color: var(--ink-muted); }

      /* Approve is the primary action; Reject is the destructive one. They used
         to be equally saturated green and red at equal size, so a safe action
         and a destructive one carried identical visual weight. */
      .action-buttons {
        display: flex;
        gap: var(--sp-2);
        flex-wrap: wrap;
      }
      .action-buttons .btn { flex: 1 1 10rem; min-height: var(--tap-target-min); }
      .btn-approve:hover { background: color-mix(in oklch, var(--ok) 85%, white); }
      .btn-reject { background: transparent; color: var(--danger); border-color: color-mix(in oklch, var(--danger) 45%, transparent); font-weight: 600; }
      .btn-reject:hover { background: color-mix(in oklch, var(--danger) 12%, transparent); }
      /* --- HX-12: the header ----------------------------------------
         The role chip rendered as three stacked lines ("focal-", "point",
         "(en)") and "Sign out" broke to "Sign"/"out" inside a 64x50 box,
         because the label was a machine handle that could not fit and nothing
         forbade it wrapping. The role moved to the navbar, which already
         carries it; what is left is short, and is not allowed to break. */
      .identity-label {
        color: var(--ink-muted);
        font-size: 0.8125rem;
        white-space: nowrap;
      }
      .identity-input {
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 0.875rem;
        min-width: 0;
      }
      .signout-btn { white-space: nowrap; }

      /* --- CW-13: the queue -----------------------------------------
         The card carried "1 of 3" and nothing else, so a focal point who
         noted the position had to remember it. The district is in the header
         now; position is a convenience, not the identifier. */
      .card-district {
        font-weight: 600;
        margin-inline-end: auto;
        padding-inline-start: var(--sp-2);
      }

      /* CW-02: a threshold no protocol states is not a threshold. Said
         plainly on the card, because the reader's other option is to assume
         it was checked. */
      .ungoverned { color: var(--ink-muted); font-weight: 400; }

      /* CW-07: the confirmation the operator is asked to check against. */
      .dialog-summary {
        padding: var(--sp-3);
        margin-bottom: var(--sp-3);
        border-inline-start: 3px solid var(--brand);
        background: var(--surface);
        border-radius: 0 var(--r) var(--r) 0;
        font-size: 0.9375rem;
      }
      .summary-line + .summary-line { margin-top: var(--sp-2); }
      .dialog-summary strong { font-weight: 600; }

      /* Visible as well as announced: the outcome of an approval was
         previously confined to a visually-hidden region, so the focal point
         who pressed the button saw nothing happen. */
      .decision-outcome {
        padding: var(--sp-3);
        margin-bottom: var(--sp-3);
        border-inline-start: 3px solid var(--ok);
        background: var(--surface);
        border-radius: 0 var(--r) var(--r) 0;
        font-size: 0.9375rem;
      }
      .decision-outcome:empty { display: none; }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to pending review</a>
    <div id="offlineBanner" class="offline-banner" hidden>
      <span data-i18n="banner.offline">Offline. Changes will sync when you reconnect.</span>
    </div>

    <header>
      <!-- The page title was a <span>, so the document had no <h1> at all and
           ran h2 -> h3 -> h3 with the brand doing the heading's job. -->
      <h1 class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
          <circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
          <circle cx="12" cy="12" r="11" stroke="currentColor" stroke-width="1" fill="none" opacity="0.25"/>
        </svg>
        <span data-i18n="app.title">Lindela Lite</span>
        <!-- The role is dropped from the title: the shared navbar already carries
             "Focal Point" as the active nav item, and the H1 repeated it a
             third time. Three statements of one identity on a 640px page is a
             page that is mostly telling you where you are. -->
      </h1>
      <div class="header-controls">
        <select id="locale-select" aria-label="Language">
          <option value="en">English</option>
          <option value="sw">Swahili</option>
          <option value="so">Somali</option>
          <option value="ar">العربية</option>
          <option value="din">Dinka</option>
          <option value="km">Karimojong</option>
          <option value="nk">Ngakarimojong</option>
        </select>
        <!-- The header used to print `focal-point (en)`: a machine handle read as
             a person's name, with the locale code appended as though it were a
             role. Decisions were logged "by anonymous" because nothing on this
             surface ever set an identity. The name is now asked for, kept, and
             sent with the transition. -->
        <label class="identity-label" for="fpName">Signed in as</label>
        <input id="fpName" class="identity-input" type="text" autocomplete="name"
               placeholder="Your name" size="14">
        <button class="signout-btn" id="signoutBtn">Sign out</button>
      </div>
    </header>

    <main id="main" tabindex="-1">
      <div class="pending-queue" id="pendingQueue" tabindex="-1">
        <h2 data-i18n="focal-point.pending">Pending review</h2>
        <!-- Approving a trigger is the highest-consequence action in this
             product, and its outcome reached nothing: the confirmation lived in
             a visually-hidden region, so a sighted focal point got silence and
             a screen-reader user got the only account of what their click did. -->
        <p class="decision-outcome" id="decisionOutcome" role="status" aria-live="polite" hidden></p>
        <div id="pendingList"></div>
      </div>

      <div class="protocols-section">
        <h3 data-i18n="focal-point.protocols">Active pre-authorised protocols</h3>
        <div id="protocolsList"></div>
      </div>

      <div class="audit-trail">
        <h3 data-i18n="focal-point.decisions">Recent decisions</h3>
        <div id="auditList"></div>
      </div>
    </main>

    <footer>
      <span id="connectionStatus" style="color: var(--ink-muted);">●</span>
      <span id="statusText" style="margin-left: 0.5rem; font-size: 0.875rem;"></span>
    </footer>

    <!-- Approval/Rejection Dialog -->
    <dialog id="decisionDialog" aria-labelledby="decisionTitle" aria-describedby="decisionSummary decisionReasonLabel">
      <div class="dialog-header">
        <h2 id="decisionTitle">Confirm decision</h2>
        <button class="dialog-close" type="button" aria-label="Close">×</button>
      </div>
      <div class="dialog-body">
        <!-- What is being approved, before the field the operator supplies.
             This modal used to name nothing at all, so the last check before
             pre-agreed finance moved carried three identical-looking buttons
             and no district, rule, reading or amount. -->
        <div id="decisionSummary" class="dialog-summary"></div>
        <div class="form-group">
          <label for="reasonSelect" id="decisionReasonLabel" data-i18n="focal-point.reason">Reason</label>
          <select id="reasonSelect" required></select>
        </div>
      </div>
      <div class="dialog-actions">
        <button class="btn-cancel" id="dialogCancelBtn" type="button" data-i18n="action.cancel">Cancel</button>
        <button id="dialogConfirmBtn" type="button" class="btn btn-primary">Confirm</button>
      </div>
    </dialog>

    <script type="module">
      import { mountNavbar } from '/shared/navbar.js'
      mountNavbar({ activePath: '/focal-point' })
    </script>
    <script type="module" src="/focal-point/app.js"></script>
    <script type="module" src="/shared/demo.js"></script>
</body>
</html>
